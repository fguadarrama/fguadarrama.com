<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Francisco Guadarrama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
/* ===========================================================
   TOKENS
   =========================================================== */
:root{
  --bg:#f8f8f8;
  --text:#2c292f;
  --accent:#5037f9;
  --sec:0.95;

  --t-size:50px; --t-weight:580; --t-lh:46px; --t-ls:-0.08em; --t-ws:0.05em;
  --b-size:17px; --b-weight:350; --b-lh:22px; --b-ls:-0.05em; --b-ws:-0.04em; --b-gap:15px;
  --n-size:24px; --n-weight:470; --n-ls:-0.1em;
  --m-size:16px; --m-weight:300; --m-ls:-0.04em;
  --l-size:16px; --l-weight:300; --l-ls:-0.04em;
  --v-size:16px; --v-weight:530; --v-lh:14px; --v-ls:-0.05em;
  --p-size:12px; --p-weight:620; --p-ls:-0.04em;

  --col-rail:110px; --col-text:680px; --col-side:205px; --gap:60px;

  /* flechas */
  --arrow-size:19px; --arrow-w:11px; --arrow-stroke:1.5px;
  --arrow-pulse:3px; --arrow-period:1300ms; --arrow-gap:10px;

  /* flujo y transición entre entradas */
  --post-gap:150px;
  --swap-dur:220ms; --swap-shift:7px; --swap-stagger:45ms;
  --reveal-shift:14px; --reveal-dur:600ms;

  /* línea del tiempo */
  --tick-gap:17px;
  --tick-stroke:1.5px;
  --tick-stroke-entry:1.5px;
  --tick-base:14px;
  --tick-ext:16px;
  --tick-falloff:0.62;
  --tick-op:0.95;
  --tick-op-entry:1;
  --rail-fold:300ms;
  --rail-split:340ms;
  --rail-wave:260ms;
  --rail-tau:85ms;

  --topbar-h:70px;

  --ease-out:cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1);
  --dur-fast:160ms;
  --dur-ui:200ms;
  --dur-move:260ms;
}

@supports (color: color(display-p3 1 1 1)){
  :root{
    --bg: color(display-p3 0.9725 0.9725 0.9725);
    --text: color(display-p3 0.1725 0.1608 0.1843);
    --accent: color(display-p3 0.3137 0.2157 0.9765);
  }
}

/* ===========================================================
   BASE
   =========================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:"Albert Sans",system-ui,sans-serif;
  font-synthesis-weight:none;-webkit-font-smoothing:antialiased;min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===========================================================
   BARRA SUPERIOR
   =========================================================== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--bg)}
.topbar .inner{
  max-width:1160px;margin:0 auto;padding:20px 30px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.topbar h1{
  font-size:var(--n-size);font-weight:var(--n-weight);
  letter-spacing:var(--n-ls);line-height:1.1;opacity:var(--sec);
}
.menu{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--text);
  display:grid;place-items:center;flex:none;
  transition:background var(--dur-fast) ease,color var(--dur-fast) ease;
}
@media (hover:hover) and (pointer:fine){ .menu:hover{background:var(--text);color:var(--bg)} }
.menu[aria-expanded="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}

.index{
  position:absolute;right:30px;top:calc(100% - 6px);z-index:41;
  min-width:270px;max-width:min(360px, calc(100vw - 60px));
  max-height:min(60vh, 520px);overflow:auto;
  background:var(--bg);border:1px solid var(--text);border-radius:14px;padding:8px;
  transform-origin:top right;opacity:0;transform:scale(0.97) translateY(-4px);pointer-events:none;
  transition:opacity var(--dur-ui) var(--ease-out),transform var(--dur-ui) var(--ease-out);
}
.index.open{opacity:1;transform:none;pointer-events:auto}
.index button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:9px;
  transition:background var(--dur-fast) ease,color var(--dur-fast) ease}
.index button .d{display:block;font-size:calc(var(--l-size) - 3px);font-weight:var(--l-weight);
  letter-spacing:var(--l-ls);opacity:var(--sec);margin-bottom:2px}
.index button .t{display:block;font-size:var(--v-size);font-weight:var(--v-weight);
  letter-spacing:var(--v-ls);line-height:1.25}
@media (hover:hover) and (pointer:fine){
  .index button:hover{background:var(--accent);color:var(--bg)}
  .index button:hover .d{opacity:1}
}
.index button[aria-current="true"] .t{color:var(--accent)}
.index button[aria-current="true"]:hover .t{color:var(--bg)}

/* ===========================================================
   REJILLA
   =========================================================== */
.wrap{max-width:1160px;margin:0 auto;padding:calc(var(--topbar-h) + 46px) 30px 40vh}
.layout{display:grid;grid-template-columns:var(--col-rail) minmax(0,var(--col-text)) var(--col-side);
  gap:var(--gap);align-items:start}

/* ===========================================================
   LÍNEA DEL TIEMPO
   =========================================================== */
.rail{position:sticky;top:calc(var(--topbar-h) + 20px);overflow:visible}
.rail svg{display:block;overflow:visible;touch-action:pan-y}
.rail line{
  stroke:var(--text);stroke-width:var(--tick-stroke);stroke-linecap:round;opacity:var(--tick-op);
  transition:stroke var(--dur-ui) ease,opacity var(--dur-ui) ease,stroke-width var(--dur-ui) ease;
}
.rail line.entry{stroke:var(--accent);stroke-width:var(--tick-stroke-entry);opacity:var(--tick-op-entry)}
.rail svg[data-phase="fold"] line{stroke:var(--text);stroke-width:var(--tick-stroke);opacity:var(--tick-op)}
.pill{
  position:absolute;left:calc(var(--tick-base) + var(--tick-ext) + 14px);top:0;
  background:var(--accent);color:var(--bg);
  font-size:var(--p-size);font-weight:var(--p-weight);letter-spacing:var(--p-ls);
  padding:6px 11px;border-radius:999px;white-space:nowrap;line-height:1;opacity:0;
  transition:transform var(--dur-move) var(--ease-in-out),opacity var(--dur-ui) var(--ease-out);
}
.pill.on{opacity:1}

/* ===========================================================
   FLUJO CONTINUO DE ENTRADAS
   =========================================================== */
.stream{display:block}
.post{scroll-margin-top:calc(var(--topbar-h) + 24px)}
.post + .post{margin-top:var(--post-gap)}

.postmeta{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:44px}
.postmeta .who{font-size:var(--m-size);font-weight:var(--m-weight);
  letter-spacing:var(--m-ls);opacity:var(--sec)}

.title{font-size:var(--t-size);font-weight:var(--t-weight);line-height:var(--t-lh);
  letter-spacing:var(--t-ls);word-spacing:var(--t-ws);margin-bottom:38px;text-wrap:balance}
.body p{font-size:var(--b-size);font-weight:var(--b-weight);line-height:var(--b-lh);
  letter-spacing:var(--b-ls);word-spacing:var(--b-ws)}
.body p + p{margin-top:var(--b-gap)}

/* aparición de cada entrada al entrar en pantalla */
.post .reveal{
  opacity:0;transform:translateY(var(--reveal-shift));
  transition:opacity var(--reveal-dur) var(--ease-out),transform var(--reveal-dur) var(--ease-out);
}
.post.seen .reveal{opacity:1;transform:none}
.post.seen .reveal:nth-child(2){transition-delay:60ms}
.post.seen .reveal:nth-child(3){transition-delay:110ms}
html.no-reveal .post .reveal{opacity:1;transform:none;transition:none}

/* --- flechas --- */
.nav{display:flex;gap:var(--arrow-gap);flex:none;align-items:center}
.nav button{color:var(--accent);display:grid;place-items:center;padding:6px;
  transition:opacity var(--dur-fast) ease}
.nav button[disabled]{opacity:.22;cursor:default}
.nav .ico{display:block;will-change:transform}
.nav svg{display:block;width:var(--arrow-w);height:var(--arrow-size);overflow:visible}
.nav svg path{fill:none;stroke:currentColor;stroke-width:var(--arrow-stroke);
  stroke-linecap:round;stroke-linejoin:round}
.nav .flip{transform:rotate(180deg)}

/* --- enlace de continuidad al final de cada entrada --- */
.continue{
  display:inline-flex;align-items:center;gap:9px;margin-top:calc(var(--b-gap) * 2);
  color:var(--accent);font-size:var(--m-size);font-weight:var(--v-weight);
  letter-spacing:var(--m-ls);
}
.continue svg{display:block;width:var(--arrow-w);height:var(--arrow-size);overflow:visible}
.continue svg path{fill:none;stroke:currentColor;stroke-width:var(--arrow-stroke);
  stroke-linecap:round;stroke-linejoin:round}
.continue .ico{display:block;will-change:transform}

@keyframes arrow-next{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--arrow-pulse))}}
@keyframes arrow-prev{0%,100%{transform:translateX(0)}50%{transform:translateX(calc(var(--arrow-pulse) * -1))}}
@media (hover:hover) and (pointer:fine){
  [data-go="next"]:not([disabled]):hover .ico,
  .continue:hover .ico{animation:arrow-next var(--arrow-period) var(--ease-in-out) infinite}
  [data-go="prev"]:not([disabled]):hover .ico{animation:arrow-prev var(--arrow-period) var(--ease-in-out) infinite}
}

/* ===========================================================
   COLUMNA DERECHA — cambia con la entrada activa
   =========================================================== */
.side{position:sticky;top:calc(var(--topbar-h) + 20px);display:grid;gap:36px}
.field .label{display:block;font-size:var(--l-size);font-weight:var(--l-weight);
  letter-spacing:var(--l-ls);opacity:var(--sec);margin-bottom:12px}
.field .value{
  font-size:var(--v-size);font-weight:var(--v-weight);
  line-height:var(--v-lh);letter-spacing:var(--v-ls);
  transition:opacity var(--swap-dur) var(--ease-out),transform var(--swap-dur) var(--ease-out);
}
.field:nth-child(2) .value{transition-delay:var(--swap-stagger)}
.value[data-phase="out-up"]  {opacity:0;transform:translateY(calc(var(--swap-shift) * -1))}
.value[data-phase="out-down"]{opacity:0;transform:translateY(var(--swap-shift))}
.value[data-phase="in-down"] {opacity:0;transform:translateY(var(--swap-shift))}
.value[data-phase="in-up"]   {opacity:0;transform:translateY(calc(var(--swap-shift) * -1))}

/* ===========================================================
   RESPONSIVE
   =========================================================== */
@media (max-width:1000px){
  .layout{grid-template-columns:1fr;gap:40px}
  .rail{display:none}
  .side{display:none}
  .wrap{padding:calc(var(--topbar-h) + 30px) 20px 25vh}
  .topbar .inner{padding:16px 20px}
  .index{right:20px}
  .post + .post{margin-top:calc(var(--post-gap) * .7)}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms!important}
  .ico{animation:none!important}
  .post .reveal{opacity:1;transform:none}
}

/* ===========================================================
   PANELES DE PROTOTIPO (gris neutro, fuera de la paleta)
   =========================================================== */
.protodock{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;gap:8px}
.protodock button{background:#1b1c22;color:#fff;font-size:13px;font-weight:500;
  padding:11px 16px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.22)}
.panel{position:fixed;right:18px;bottom:18px;z-index:61;width:334px;
  max-height:calc(100vh - 36px);overflow:auto;background:#1b1c22;color:#fff;
  border-radius:16px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:12px;display:none}
.panel.open{display:block}
.panel h2{font-size:13px;font-weight:600;margin-bottom:2px}
.panel .sub{opacity:.55;margin-bottom:14px;line-height:1.4}
.panel details{border-top:1px solid #34363f;padding:9px 0}
.panel summary{cursor:pointer;font-weight:600;list-style:none;padding:3px 0}
.panel summary::-webkit-details-marker{display:none}
.panel summary::before{content:"+ ";opacity:.5}
.panel details[open] summary::before{content:"– "}
.ctrl{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;margin:9px 0 0}
.ctrl label{opacity:.72}
.ctrl output{font-variant-numeric:tabular-nums;opacity:.95}
.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:#5037f9;height:18px}
.ctrl input[type=color]{width:34px;height:26px;padding:0;border:1px solid #43454f;border-radius:6px;background:none;cursor:pointer}
.ctrl input[type=text]{grid-column:1/-1;width:100%;background:#26272f;border:1px solid #3a3c46;color:#fff;border-radius:6px;padding:6px 8px;font:inherit}
.ctrl input[type=checkbox]{width:16px;height:16px;accent-color:#5037f9}
.rowbtns{display:flex;gap:8px;margin-top:14px}
.rowbtns button{flex:1;background:#5037f9;color:#fff;border-radius:9px;padding:9px;font-weight:600}
.rowbtns button.ghost{background:#2c2e37}
.out{width:100%;height:190px;margin-top:10px;background:#101116;color:#dfe1e8;
  border:1px solid #3a3c46;border-radius:9px;padding:9px;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.45;
  display:none;white-space:pre;overflow:auto}
.out.show{display:block}
@media print{.panel,.protodock{display:none!important}}
</style>
</head>

<body>

<header class="topbar">
  <div class="inner">
    <h1>Francisco Guadarrama</h1>
    <button class="menu" id="menuBtn" aria-expanded="false" aria-controls="index" aria-label="Índice de entradas">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none" aria-hidden="true">
        <path d="M1 1h15M3 5.5h11M6 10h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="index" id="index" role="menu" aria-label="Entradas"></div>
</header>

<div class="wrap">
  <div class="layout">

    <div class="rail" id="rail">
      <svg id="railSvg" data-phase="fold" aria-hidden="true"></svg>
      <span class="pill" id="pill"></span>
    </div>

    <main class="stream" id="stream"></main>

    <aside class="side">
      <div class="field"><span class="label">Fecha</span><p class="value" id="fDate"></p></div>
      <div class="field"><span class="label">Lugar</span><p class="value" id="fLoc"></p></div>
    </aside>

  </div>
</div>

<div class="protodock" id="dock" hidden>
  <button data-open="panelRail">Línea del tiempo</button>
  <button data-open="panelType">Prototipo</button>
</div>

<section class="panel" id="panelType" aria-label="Controles de tipografía y color">
  <h2>Tipografía, color y rejilla</h2>
  <p class="sub">Ajusta y exporta. Nada de esto viaja a la versión final.</p>
  <div id="groupsType"></div>
  <div class="rowbtns">
    <button data-export="1">Exportar</button>
    <button class="ghost" data-reset="1">Restablecer</button>
  </div>
  <div class="rowbtns">
    <button class="ghost" data-copy="1">Copiar CSS</button>
    <button class="ghost" data-download="1">Descargar</button>
  </div>
  <textarea class="out" readonly spellcheck="false"></textarea>
</section>

<section class="panel" id="panelRail" aria-label="Controles de la línea del tiempo">
  <h2>Línea del tiempo</h2>
  <p class="sub">Forma, onda y ritmo de la barra lateral.</p>
  <div id="groupsRail"></div>
  <div class="rowbtns">
    <button data-export="1">Exportar</button>
    <button class="ghost" data-reset="1">Restablecer</button>
  </div>
  <div class="rowbtns">
    <button class="ghost" data-copy="1">Copiar CSS</button>
    <button class="ghost" data-download="1">Descargar</button>
  </div>
  <textarea class="out" readonly spellcheck="false"></textarea>
</section>

<script src="posts.js"></script>
<script>
/* ===========================================================
   1. INTERRUPTOR PARA LA VERSIÓN FINAL
   =========================================================== */
const PROTOTYPE = true;

/* ===========================================================
   2. ÍCONO DE LAS FLECHAS
   El chevron de fguadarrama.com (.name-cue-arrow), tal cual:
   viewBox 4x7 y el trazo M0.5 0.5 L3.5 3.5 L0.5 6.5.
   Va con preserveAspectRatio="none" como en tu sitio, así que
   --arrow-w y --arrow-size estiran el dibujo de forma
   independiente; el grosor no se deforma gracias a
   vector-effect="non-scaling-stroke".
   =========================================================== */
const ARROW_VIEWBOX = '0 0 4 7';
const ARROW_PATH = `
  <path d="M0.5 0.5 L3.5 3.5 L0.5 6.5" vector-effect="non-scaling-stroke"/>
`;
const arrowSVG = flip =>
  `<svg class="${flip ? 'flip' : ''}" viewBox="${ARROW_VIEWBOX}" preserveAspectRatio="none" aria-hidden="true">${ARROW_PATH}</svg>`;

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const canHover = matchMedia('(hover: hover) and (pointer: fine)');

/* ===========================================================
   3. COLOR DISPLAY-P3
   =========================================================== */
const P3_OK = window.CSS && CSS.supports('color','color(display-p3 1 1 1)');
function toP3(hex){
  const h = hex.replace('#','');
  const n = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
  const r = parseInt(n.slice(0,2),16)/255, g = parseInt(n.slice(2,4),16)/255, b = parseInt(n.slice(4,6),16)/255;
  return P3_OK ? `color(display-p3 ${+r.toFixed(4)} ${+g.toFixed(4)} ${+b.toFixed(4)})` : hex;
}

/* ===========================================================
   4. TOKENS
   =========================================================== */
const SPEC_TYPE = [
  ['Color', [
    ['bg','--bg','Fondo','color','#f8f8f8'],
    ['text','--text','Texto','color','#2c292f'],
    ['accent','--accent','Acento','color','#5037f9'],
    ['sec','--sec','Opacidad secundaria','range','0.95',0.3,1,0.01,'']
  ]],
  ['Título', [
    ['tSize','--t-size','Tamaño','range','50px',24,120,1,'px'],
    ['tWeight','--t-weight','Peso','range','580',100,900,10,''],
    ['tLh','--t-lh','Interlínea','range','46px',24,140,1,'px'],
    ['tLs','--t-ls','Interletraje','range','-0.08em',-0.12,0.08,0.005,'em'],
    ['tWs','--t-ws','Espacio entre palabras','range','0.05em',-0.1,0.4,0.01,'em']
  ]],
  ['Cuerpo', [
    ['bSize','--b-size','Tamaño','range','17px',12,32,1,'px'],
    ['bWeight','--b-weight','Peso','range','350',100,900,10,''],
    ['bLh','--b-lh','Interlínea','range','22px',14,56,1,'px'],
    ['bLs','--b-ls','Interletraje','range','-0.05em',-0.1,0.1,0.005,'em'],
    ['bWs','--b-ws','Espacio entre palabras','range','-0.04em',-0.1,0.4,0.01,'em'],
    ['bGap','--b-gap','Espacio entre párrafos','range','15px',0,64,1,'px']
  ]],
  ['Nombre y meta', [
    ['nSize','--n-size','Nombre · tamaño','range','24px',16,64,1,'px'],
    ['nWeight','--n-weight','Nombre · peso','range','470',100,900,10,''],
    ['nLs','--n-ls','Nombre · interletraje','range','-0.1em',-0.14,0.1,0.005,'em'],
    ['mSize','--m-size','Meta · tamaño','range','16px',10,24,1,'px'],
    ['mWeight','--m-weight','Meta · peso','range','300',100,900,10,''],
    ['mLs','--m-ls','Meta · interletraje','range','-0.04em',-0.1,0.2,0.005,'em']
  ]],
  ['Columna derecha', [
    ['lSize','--l-size','Etiqueta · tamaño','range','16px',10,24,1,'px'],
    ['lWeight','--l-weight','Etiqueta · peso','range','300',100,900,10,''],
    ['lLs','--l-ls','Etiqueta · interletraje','range','-0.04em',-0.1,0.2,0.005,'em'],
    ['vSize','--v-size','Valor · tamaño','range','16px',12,32,1,'px'],
    ['vWeight','--v-weight','Valor · peso','range','530',100,900,10,''],
    ['vLh','--v-lh','Valor · interlínea','range','14px',10,48,1,'px'],
    ['vLs','--v-ls','Valor · interletraje','range','-0.05em',-0.1,0.1,0.005,'em']
  ]],
  ['Flujo y transición', [
    ['postGap','--post-gap','Espacio entre entradas','range','150px',40,400,10,'px'],
    ['swapDur','--swap-dur','Cambio · duración','range','220ms',60,600,10,'ms'],
    ['swapShift','--swap-shift','Cambio · desplazamiento','range','7px',0,30,1,'px'],
    ['swapStagger','--swap-stagger','Cambio · retardo del 2º dato','range','45ms',0,300,5,'ms'],
    ['revealShift','--reveal-shift','Aparición · desplazamiento','range','14px',0,60,1,'px'],
    ['revealDur','--reveal-dur','Aparición · duración','range','600ms',100,1400,20,'ms'],
    ['reveal',null,'Aparición al entrar en pantalla','toggle','1']
  ]],
  ['Flechas', [
    ['arrowSize','--arrow-size','Alto','range','19px',8,48,1,'px'],
    ['arrowW','--arrow-w','Ancho','range','11px',4,40,1,'px'],
    ['arrowStroke','--arrow-stroke','Grosor del trazo','range','1.5px',0.5,4,0.25,'px'],

const DEFAULTS = {}, VARS = {};
ALL_SPEC.forEach(([,items]) => items.forEach(([k,v,,type,def]) => {
  if (type === 'action') return;
  DEFAULTS[k] = def; VARS[k] = v;
}));
let tokens = {...DEFAULTS};

function apply(){
  const r = document.documentElement.style;
  for (const k in tokens){
    if (!VARS[k]) continue;
    r.setProperty(VARS[k], (k==='bg'||k==='text'||k==='accent') ? toP3(tokens[k]) : tokens[k]);

/* ===========================================================
   5. ENTRADAS
   =========================================================== */
const posts = (window.POSTS || []).slice().sort((a,b)=> a.date.localeCompare(b.date));
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const d = s => new Date(s + 'T12:00:00');
const fmtShort = x => `${x.getDate()} ${MES[x.getMonth()]} ${x.getFullYear()}`;
const fmtLong  = x => `${x.getDate()} de ${MESL[x.getMonth()]} de ${x.getFullYear()}`;

let current = 0;
let nodes = [];

function buildTicks(){
  if (!posts.length) return [];
  const first = d(posts[0].date), last = d(posts[posts.length-1].date);
  const byMonth = (last - first) / 86400000 > 1095;
  const step = t => byMonth ? new Date(t.getFullYear(), t.getMonth()+1, 1, 12)
                            : new Date(t.getFullYear(), t.getMonth(), t.getDate()+7, 12);
  let t = byMonth ? new Date(first.getFullYear(), first.getMonth(), 1, 12)
                  : new Date(first.getFullYear(), first.getMonth(), first.getDate()-7, 12);
  const end = new Date(last.getTime() + (byMonth ? 86400000*60 : 86400000*21));
  const dates = [];
  while (t <= end || dates.length < 30){
    dates.push(new Date(t)); t = step(t);
    if (dates.length > 400) break;
  }
  return dates.map(date => ({
    date,
    post: posts.findIndex(p => { const pd = d(p.date); return pd >= date && pd < step(date); })
  }));
}
const TICKS = buildTicks();
const tickOfPost = posts.map((_,i)=> Math.max(0, TICKS.findIndex(t => t.post === i)));

/* --- todas las entradas se renderizan de una vez, en columna --- */
function renderStream(){
  const stream = document.getElementById('stream');
  stream.innerHTML = '';
  nodes = posts.map((p, i) => {
    const el = document.createElement('article');
    el.className = 'post';
    el.id = p.id || 'post-' + i;
    el.dataset.i = i;
    const siguiente = posts[i + 1];
    el.innerHTML = `
      <div class="postmeta reveal">
        <span class="who">${p.chapter || ''} · ${p.range || ''}</span>
        <div class="nav">
          <button data-go="prev" aria-label="Entrada anterior" ${i === 0 ? 'disabled' : ''}>
            <span class="ico">${arrowSVG(true)}</span>
          </button>
          <button data-go="next" aria-label="Entrada siguiente" ${i === posts.length-1 ? 'disabled' : ''}>
            <span class="ico">${arrowSVG(false)}</span>
          </button>
        </div>
      </div>
      <h2 class="title reveal">${p.title}</h2>
      <div class="body reveal">${p.body.map(t => `<p>${t}</p>`).join('')}</div>
      ${siguiente ? `<button class="continue" data-go="next">
          Continuar a ${siguiente.chapter || 'la siguiente entrada'}
          <span class="ico">${arrowSVG(false)}</span>
        </button>` : ''}`;
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-go]');
      if (!b || b.disabled) return;
      scrollToPost(i + (b.dataset.go === 'next' ? 1 : -1));
    });
    stream.appendChild(el);
    return el;
  });
}

function scrollToPost(i){
  if (i < 0 || i >= nodes.length) return;
  nodes[i].scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
}

/* --- cambio de valores en la columna derecha --- */
const fDate = document.getElementById('fDate'), fLoc = document.getElementById('fLoc');
function swapValue(el, text, dir){
  if (el.textContent === text) return;
  if (reduceMotion.matches){ el.textContent = text; return; }
  clearTimeout(el._swap);
  el.dataset.phase = dir > 0 ? 'out-up' : 'out-down';
  const ms = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--swap-dur')) || 220;
  el._swap = setTimeout(() => {
    el.textContent = text;
    el.dataset.phase = dir > 0 ? 'in-down' : 'in-up';
    requestAnimationFrame(()=> requestAnimationFrame(()=> el.removeAttribute('data-phase')));
  }, ms);
}

function setActive(i, dir){
  if (i === current || i < 0 || i >= posts.length) return;
  const p = posts[i];
  current = i;
  swapValue(fDate, fmtLong(d(p.date)), dir);
  swapValue(fLoc, p.location || '—', dir);
  document.title = p.title + ' — Francisco Guadarrama';
  if (p.id){ try{ history.replaceState(null, '', '#' + p.id); }catch(e){} }
  markIndex();
  rail.sync();
}

/* --- entrada activa según la posición de lectura --- */
let ticking = false;
function onScroll(){
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const line = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')) || 70)
                 + innerHeight * 0.30;
    let found = 0;
    for (let i = 0; i < nodes.length; i++){
      if (nodes[i].getBoundingClientRect().top <= line) found = i;
    }
    if (found !== current) setActive(found, found > current ? 1 : -1);
  });
}
addEventListener('scroll', onScroll, {passive:true});

/* --- aparición de cada entrada --- */
function watchReveal(){
  if (!('IntersectionObserver' in window)){
    nodes.forEach(n => n.classList.add('seen'));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting){ e.target.classList.add('seen'); io.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -12% 0px', threshold: 0.02 });
  nodes.forEach(n => io.observe(n));
}

/* ===========================================================
   6. LÍNEA DEL TIEMPO ANIMADA
   Adaptación de LucasHJin/scrollbar-but-cooler.
   =========================================================== */
const ORDER = ['compressed','extended','split','tracking'];
function cubicBezier(x1,y1,x2,y2){
  const at = (a,b,t) => 3*a*t*(1-t)**2 + 3*b*t*t*(1-t) + t**3;
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 24; i++){ if (at(x1,x2,t) < x) lo = t; else hi = t; t = (lo+hi)/2; }
    return at(y1,y2,t);
  };
}
const EASE_OUT = cubicBezier(0.23, 1, 0.32, 1);
const lerp = (a,b,t) => a + (b-a)*t;

const rail = (function(){
  const host = document.getElementById('rail');
  const svg  = document.getElementById('railSvg');
  const pill = document.getElementById('pill');
  const n = TICKS.length;
  const TRANS = [
    { duration: 0.30, ease: EASE_OUT },
    { duration: 0.34, ease: EASE_OUT },
    { duration: 0.26, ease: EASE_OUT }
  ];
  let lines = [], poses = null, G = null;
  const extend = new Float64Array(n);
  let progress = 0, target = 3, rafId = null, lastTime = 0;
  let hoverIndex = null, entered = false;

  function readGeometry(){
    const cs = getComputedStyle(document.documentElement);
    const num = v => parseFloat(cs.getPropertyValue(v));
    TRANS[0].duration = Math.max(0.001, num('--rail-fold') / 1000);
    TRANS[1].duration = Math.max(0.001, num('--rail-split') / 1000);
    TRANS[2].duration = Math.max(0.001, num('--rail-wave') / 1000);
    return {
      gap: num('--tick-gap'), stroke: num('--tick-stroke'),
      base: num('--tick-base'), ext: num('--tick-ext'),
      falloff: num('--tick-falloff'), tau: Math.max(0.005, num('--rail-tau') / 1000)
    };
  }
  function buildPoses(){
    const H = n * G.gap, x0 = G.stroke / 2, cx = H / 2;
    const foldLen = Math.min(48, H * 0.14), segLen = foldLen / n, top = cx - foldLen/2;
    const compressed = [], extended = [], split = [];
    for (let i = 0; i < n; i++){
      compressed.push([x0, top + i*segLen, x0, top + (i+1)*segLen]);
      extended.push([x0, i*G.gap, x0, (i+1)*G.gap]);
      const c = (i + 0.5) * G.gap;
      split.push([x0, c, x0 + G.base, c]);
    }
    return { compressed, extended, split, tracking: split, H };
  }
  function build(){
    G = readGeometry();
    poses = buildPoses();
    const W = G.base + G.ext + 6;
    svg.setAttribute('viewBox', `0 0 ${W} ${poses.H}`);
    svg.setAttribute('width', W);
    svg.setAttribute('height', poses.H);
    if (lines.length !== n){
      svg.innerHTML = '';
      lines = TICKS.map(() => svg.appendChild(document.createElementNS('http://www.w3.org/2000/svg','line')));
      TICKS.forEach((t,i) => lines[i].classList.toggle('entry', t.post > -1));
    }
  }
  function scrollFraction(){
    const max = document.documentElement.scrollHeight - innerHeight;
    return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
  }
  function focusIndex(){
    if (hoverIndex !== null && tokens.hoverWave === '1') return hoverIndex;
    if (tokens.followScroll === '1') return Math.round(scrollFraction() * (n - 1));
    return tickOfPost[current] ?? 0;
  }
  const extensionFor = (i, f) => G.ext * G.falloff ** Math.abs(i - f);
  function advanceExtensions(dt){
    const f = focusIndex();
    const alpha = reduceMotion.matches ? 1 : 1 - Math.exp(-dt / G.tau);
    let settled = true;
    for (let i = 0; i < n; i++){
      const goal = extensionFor(i, f);
      const next = extend[i] + (goal - extend[i]) * alpha;
      if (Math.abs(goal - next) < 0.05) extend[i] = goal;
      else { extend[i] = next; settled = false; }
    }
    return settled;
  }
  function applyGeometry(t){
    const seg = Math.min(Math.max(Math.floor(t), 0), TRANS.length - 1);
    const from = poses[ORDER[seg]], to = poses[ORDER[seg + 1]];
    const local = TRANS[seg].ease(t - seg);
    const extScale = seg === TRANS.length - 1 ? local : 0;
    for (let i = 0; i < n; i++){
      const f = from[i], g = to[i], el = lines[i];
      el.setAttribute('x1', lerp(f[0], g[0], local));
      el.setAttribute('y1', lerp(f[1], g[1], local));
      el.setAttribute('x2', lerp(f[2], g[2], local) + extScale * extend[i]);
      el.setAttribute('y2', lerp(f[3], g[3], local));
    }
    svg.dataset.phase = t < 1.4 ? 'fold' : 'ticks';
    pill.classList.toggle('on', t > 1.9);
  }
  function advance(dt){
    if (reduceMotion.matches){ progress = target; return; }
    let left = dt;
    while (left > 0 && progress !== target){
      const dir = target > progress ? 1 : -1;
      const seg = dir > 0 ? Math.min(Math.floor(progress), TRANS.length - 1)
                          : Math.max(Math.ceil(progress) - 1, 0);
      const bound = dir > 0 ? seg + 1 : seg;
      const stop = dir > 0 ? Math.min(target, bound) : Math.max(target, bound);
      const dur = TRANS[seg].duration;
      const time = Math.abs(stop - progress) * dur;
      if (time <= left){ progress = stop; left -= time; }
      else { progress += (left / dur) * dir; left = 0; }
    }
  }
  function step(now){
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    advance(dt);
    const settled = advanceExtensions(dt);
    applyGeometry(progress);
    if (progress === target && settled){ rafId = null; return; }
    rafId = requestAnimationFrame(step);
  }
  function kick(){
    if (rafId === null){ lastTime = performance.now(); rafId = requestAnimationFrame(step); }
  }
  function movePill(){
    if (!posts.length) return;
    const i = tickOfPost[current] ?? 0;
    pill.textContent = fmtShort(d(posts[current].date));
    pill.style.transform = `translateY(${(i + 0.5) * G.gap - pill.offsetHeight / 2}px)`;
  }
  function indexFromEvent(e){
    const r = svg.getBoundingClientRect();
    return Math.min(n - 1, Math.max(0, Math.floor((e.clientY - r.top) / G.gap)));
  }
  function nearestPost(i){
    for (let r = 0; r <= 1; r++){
      if (TICKS[i - r] && TICKS[i - r].post > -1) return TICKS[i - r].post;
      if (TICKS[i + r] && TICKS[i + r].post > -1) return TICKS[i + r].post;
    }
    return null;
  }
  host.addEventListener('pointermove', e => {
    if (!canHover.matches) return;
    const i = indexFromEvent(e);
    if (i !== hoverIndex){ hoverIndex = i; kick(); }
    host.style.cursor = nearestPost(i) !== null ? 'pointer' : '';
  });
  host.addEventListener('pointerleave', ()=>{ hoverIndex = null; host.style.cursor = ''; kick(); });
  host.addEventListener('click', e => {
    const near = nearestPost(indexFromEvent(e));
    if (near !== null) scrollToPost(near);
  });
  addEventListener('scroll', ()=>{ if (tokens.followScroll === '1') kick(); }, {passive:true});
  addEventListener('resize', ()=>{ build(); movePill(); kick(); });

  return {
    start(){
      build();
      const f = focusIndex();
      for (let i = 0; i < n; i++) extend[i] = extensionFor(i, f);
      progress = (reduceMotion.matches || entered) ? target : 0;
      entered = true;
      applyGeometry(progress);
      movePill();
      kick();
    },
    replay(){ build(); progress = reduceMotion.matches ? target : 0; applyGeometry(progress); kick(); },
    remeasure(){ build(); movePill(); kick(); },
    sync(){ movePill(); kick(); }
  };
})();
window.rail = rail;

const menuBtn = document.getElementById('menuBtn'), indexEl = document.getElementById('index');
function buildIndex(){
  indexEl.innerHTML = '';
  posts.slice().reverse().forEach(p => {
    const i = posts.indexOf(p);
    const b = document.createElement('button');
    b.setAttribute('role','menuitem');
    b.dataset.i = i;
    b.innerHTML = `<span class="d">${fmtShort(d(p.date))}</span><span class="t">${p.title}</span>`;
    b.addEventListener('click', ()=>{ closeIndex(); scrollToPost(i); });
    indexEl.appendChild(b);
  });
  markIndex();
}
function markIndex(){
  indexEl.querySelectorAll('button').forEach(b => {
    if (+b.dataset.i === current) b.setAttribute('aria-current','true');
    else b.removeAttribute('aria-current');
  });
}
function closeIndex(){ indexEl.classList.remove('open'); menuBtn.setAttribute('aria-expanded','false'); }
menuBtn.addEventListener('click', ()=>{
  menuBtn.setAttribute('aria-expanded', String(indexEl.classList.toggle('open')));
});
document.addEventListener('click', e => {
  if (!indexEl.contains(e.target) && !menuBtn.contains(e.target)) closeIndex();
});
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowLeft')  scrollToPost(current - 1);
  if (e.key === 'ArrowRight') scrollToPost(current + 1);
  if (e.key === 'Escape'){ closeIndex(); closePanels(); }
});

const topbar = document.querySelector('.topbar');
function measureTopbar(){

}
addEventListener('resize', measureTopbar);

   8. PANELES
   =========================================================== */
function buildPanel(spec, container){
  const box = document.getElementById(container);
  spec.forEach(([name, items], gi) => {
    const det = document.createElement('details');
    if (gi === 0) det.open = true;
    det.innerHTML = `<summary>${name}</summary>`;
    items.forEach(([k,,label,type,def,min,max,stepv,unit]) => {
      const row = document.createElement('div');
      row.className = 'ctrl';
      if (type === 'color'){
        row.innerHTML = `<label for="c_${k}">${label}</label>
          <input type="color" id="c_${k}" value="${def}">
          <input type="text" id="h_${k}" value="${def}" spellcheck="false">`;
        det.appendChild(row);
        const pick = row.querySelector(`#c_${k}`), hex = row.querySelector(`#h_${k}`);
        pick.addEventListener('input', ()=>{ hex.value = pick.value; tokens[k] = pick.value; apply(); save(); });
        hex.addEventListener('change', ()=>{
          const v = hex.value.trim();
          if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)){ pick.value = v; tokens[k] = v; apply(); save(); }
          else hex.value = tokens[k];
        });
      } else if (type === 'toggle'){
        row.innerHTML = `<label for="t_${k}">${label}</label><input type="checkbox" id="t_${k}">`;
        det.appendChild(row);
        const cb = row.querySelector(`#t_${k}`);
        cb.addEventListener('change', ()=>{ tokens[k] = cb.checked ? '1' : '0'; apply(); rail.sync(); save(); });
      } else if (type === 'action'){
        row.innerHTML = `<label>${label}</label><button type="button" id="a_${k}"
          style="background:#2c2e37;border-radius:7px;padding:5px 11px;font-weight:600">Reproducir</button>`;
        det.appendChild(row);
        row.querySelector(`#a_${k}`).addEventListener('click', ()=> rail.replay());
      } else {
        row.innerHTML = `<label for="r_${k}">${label}</label><output id="o_${k}">${def}</output>
          <input type="range" id="r_${k}" min="${min}" max="${max}" step="${stepv}" value="${parseFloat(def)}">`;
        det.appendChild(row);
        const sl = row.querySelector(`#r_${k}`), out = row.querySelector(`#o_${k}`);
        sl.addEventListener('input', ()=>{
          const val = sl.value + (unit || '');
          tokens[k] = val; out.textContent = val; apply(); save();
        });
      }
    });
    box.appendChild(det);
  });
}
function syncPanels(){
  for (const k in tokens){
    const sl = document.getElementById('r_'+k), out = document.getElementById('o_'+k),
          pk = document.getElementById('c_'+k), hx = document.getElementById('h_'+k),
          cb = document.getElementById('t_'+k);
    if (sl){ sl.value = parseFloat(tokens[k]); out.textContent = tokens[k]; }
    if (pk){ pk.value = tokens[k]; hx.value = tokens[k]; }
    if (cb){ cb.checked = tokens[k] === '1'; }
  }
}
function cssOut(){
  const p3 = k => {
    const h = tokens[k].replace('#',''), s = h.length===3 ? h.split('').map(c=>c+c).join('') : h;
    return [0,2,4].map(i => +(parseInt(s.slice(i,i+2),16)/255).toFixed(4)).join(' ');
  };
  const lines = [];
  ALL_SPEC.forEach(([,items]) => items.forEach(([k,v]) => {
    if (!v || ['bg','text','accent'].includes(k)) return;
    lines.push(`  ${v}: ${tokens[k]};`);
  }));
  return `:root{
  --bg: ${tokens.bg};
  --text: ${tokens.text};
  --accent: ${tokens.accent};
${lines.join('\n')}
}

@supports (color: color(display-p3 1 1 1)){
  :root{
    --bg: color(display-p3 ${p3('bg')});
    --text: color(display-p3 ${p3('text')});
    --accent: color(display-p3 ${p3('accent')});
  }
}`;
}
const FULL = () => cssOut() + '\n\n/* tokens.json */\n' + JSON.stringify(tokens, null, 2);
const STORE = 'fg-blog-tokens-v4';
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(tokens)); }catch(e){} }
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s) tokens = {...DEFAULTS, ...s}; }catch(e){}
}
const dock = document.getElementById('dock');
function closePanels(){
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
  if (PROTOTYPE) dock.hidden = false;
}
if (PROTOTYPE){
  load();
  buildPanel(SPEC_TYPE, 'groupsType');
  buildPanel(SPEC_RAIL, 'groupsRail');
  syncPanels();
  dock.hidden = false;
  dock.addEventListener('click', e => {
    const id = e.target.dataset.open;
    if (!id) return;
    closePanels();
    document.getElementById(id).classList.add('open');
    dock.hidden = true;
  });
  document.querySelectorAll('.panel').forEach(panel => {
    const out = panel.querySelector('.out');
    panel.addEventListener('click', async e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.export){ out.value = FULL(); out.classList.add('show'); }
      if (b.dataset.copy){
        try{ await navigator.clipboard.writeText(cssOut()); b.textContent = 'Copiado'; }
        catch(err){ out.value = cssOut(); out.classList.add('show'); out.select(); b.textContent = 'Selecciona y copia'; }
        setTimeout(()=> b.textContent = 'Copiar CSS', 1600);
      }
      if (b.dataset.download){
        const blob = new Blob([FULL()], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'tokens-blog.txt'; a.click();
        URL.revokeObjectURL(a.href);
      }
      if (b.dataset.reset){
        tokens = {...DEFAULTS}; apply(); syncPanels(); rail.sync(); out.classList.remove('show');
      }
    });
  });
}

/* ===========================================================
   9. ARRANQUE
   =========================================================== */
apply();
measureTopbar();
renderStream();
buildIndex();
watchReveal();

if (posts.length){
  const p = posts[0];
  fDate.textContent = fmtLong(d(p.date));
  fLoc.textContent = p.location || '—';
  document.title = p.title + ' — Francisco Guadarrama';
}

const hash = location.hash.slice(1);
if (hash){
  const i = posts.findIndex(p => p.id === hash);
  if (i > -1){
    current = i;
    fDate.textContent = fmtLong(d(posts[i].date));
    fLoc.textContent = posts[i].location || '—';
    markIndex();
    requestAnimationFrame(()=> nodes[i].scrollIntoView({behavior:'auto', block:'start'}));
  }
}

document.fonts.ready.then(()=>{ measureTopbar(); rail.remeasure(); onScroll(); });
rail.start();
onScroll();
</script>
