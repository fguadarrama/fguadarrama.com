<style>
/* ---------------------------------------------------------------
   Transitions.dev — Texts reveal (tal cual, con más líneas)
   --------------------------------------------------------------- */
:root {
  --stagger-dur: 500ms;
  --stagger-distance: 12px;
  --stagger-stagger: 40ms;
  --stagger-blur: 3px;
  --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);
}
.t-stagger-line {
  display: block;
  opacity: 0;
  transform: translateY(var(--stagger-distance));
  filter: blur(var(--stagger-blur));
  transition:
    opacity   var(--stagger-dur) var(--stagger-ease),
    transform var(--stagger-dur) var(--stagger-ease),
    filter    var(--stagger-dur) var(--stagger-ease);
  will-change: transform, opacity, filter;
}
.t-stagger-line--2 { transition-delay: calc(var(--stagger-stagger) * 1); }
.t-stagger-line--3 { transition-delay: calc(var(--stagger-stagger) * 2); }
.t-stagger-line--4 { transition-delay: calc(var(--stagger-stagger) * 3); }
.t-stagger-line--5 { transition-delay: calc(var(--stagger-stagger) * 4); }
.t-stagger-line--6 { transition-delay: calc(var(--stagger-stagger) * 5); }
.t-stagger.is-shown .t-stagger-line {
  opacity: 1;
  transform: translateY(0);
  filter: blur(0);
}
.t-stagger.is-hiding .t-stagger-line {
  opacity: 0;
  transform: translateY(0);
  filter: blur(0);
  transition:
    opacity 200ms ease,
    transform 0s linear,
    filter 0s linear;
  transition-delay: 0s;
}
@media (prefers-reduced-motion: reduce) {
  .t-stagger-line { transition: none !important; }
}

/* ---------------------------------------------------------------
   Página
   --------------------------------------------------------------- */
:root {
  --bg: #f6f7fc;
  --ink: #202e60;
  --hairline: rgba(32, 46, 96, .07);
  --press: rgba(32, 46, 96, .12);
  --tile-edge: rgba(32, 46, 96, .10);
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Albert Sans", system-ui, -apple-system, sans-serif;
  font-weight: 400;
  font-synthesis-weight: none;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding:
    calc(env(safe-area-inset-top) + 1.75rem)
    calc(env(safe-area-inset-right) + 1.25rem)
    calc(env(safe-area-inset-bottom) + 1.75rem)
    calc(env(safe-area-inset-left) + 1.25rem);
}
main { width: 100%; max-width: 34rem; margin: 0 auto; }

/* Reloj */
.clock {
  font-size: clamp(1.25rem, 5.6vw, 1.9rem);
  font-weight: 630;
  font-variation-settings: "wght" 630;
  letter-spacing: -.015em;
  white-space: nowrap;
  margin-bottom: 1.5rem;
  padding-left: .15rem;
}
number-flow {
  font-variant-numeric: tabular-nums;
  line-height: .9;
  --number-flow-mask-height: .3em;
}
.clock .sep { opacity: .55; }

/* Enlaces */
.links { display: grid; gap: .55rem; }
a.link {
  display: flex;
  align-items: center;
  gap: .95rem;
  min-height: 78px;
  padding: 1rem 1.25rem;
  border-radius: 20px;
  background: var(--hairline);
  color: var(--ink);
  text-decoration: none;
  transition:
    opacity   var(--stagger-dur) var(--stagger-ease),
    transform var(--stagger-dur) var(--stagger-ease),
    filter    var(--stagger-dur) var(--stagger-ease),
    background-color 120ms ease;
}
a.link:active { background: var(--press); }

/* Tarjeta del logotipo: mismo lienzo para todos */
.tile {
  flex: 0 0 auto;
  width: 46px;
  height: 46px;
  border-radius: 13px;
  background: #ffffff;
  box-shadow: inset 0 0 0 1px var(--tile-edge);
  display: grid;
  place-items: center;
  overflow: hidden;
}
.tile img {
  width: 30px;
  height: 30px;
  object-fit: contain;      /* conserva proporciones, nunca deforma */
  display: block;
}
.tile .mono {               /* respaldo si el logotipo no carga */
  font-size: 1.05rem;
  font-weight: 630;
  font-variation-settings: "wght" 630;
  opacity: .55;
}
.name { font-size: 1.115rem; line-height: 1.25; flex: 1 1 auto; }
.arrow { flex: 0 0 auto; font-size: 1.1rem; opacity: .4; }
.t-stagger.is-hiding a.link { transition: opacity 200ms ease, transform 0s linear, filter 0s linear; }
</style>

<script type="module">
/* ----------------------------------------------------------------
   1. Reloj: 12:12 p.m, sáb 5 de sep
   ---------------------------------------------------------------- */
const DIAS  = ['dom','lun','mar','mié','jue','vie','sáb'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const nfH = document.getElementById('nf-h');
const nfM = document.getElementById('nf-m');
const nfD = document.getElementById('nf-d');
const mer = document.getElementById('mer');
const wd  = document.getElementById('wd');
const mo  = document.getElementById('mo');

let live = false;
let last = '';

function render() {
  const t = new Date();
  const h24 = t.getHours();
  const h = h24 % 12 === 0 ? 12 : h24 % 12;
  const m = t.getMinutes();
  const d = t.getDate();

  const key = `${h}:${m}:${d}`;
  if (key === last) return;
  last = key;

  mer.textContent = (h24 < 12 ? 'a.m,' : 'p.m,');
  wd.textContent  = DIAS[t.getDay()];
  mo.textContent  = MESES[t.getMonth()];

  if (live) {
    nfH.update(h); nfM.update(m); nfD.update(d);
  } else {
    nfH.textContent = String(h);
    nfM.textContent = String(m).padStart(2, '0');
    nfD.textContent = String(d);
  }
}

render();
setInterval(render, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

(async () => {
  try {
    await import('https://esm.sh/number-flow@0.6.0');
    try { await import('https://esm.sh/number-flow@0.6.0/group'); } catch {}
    await customElements.whenDefined('number-flow');

    for (const el of [nfH, nfM, nfD]) {
      el.textContent = '';
      el.locales = 'es-MX';
      el.transformTiming = { duration: 650, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' };
      el.spinTiming      = { duration: 750, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' };
      el.opacityTiming   = { duration: 350, easing: 'ease-out' };
    }
    nfH.format = { useGrouping: false };
    nfD.format = { useGrouping: false };
    nfM.format = { minimumIntegerDigits: 2, useGrouping: false };
    nfM.digits = { 1: { max: 5 } };

    live = true;
    last = '';
    render();
  } catch {}
})();

/* ----------------------------------------------------------------
   2. Respaldo de logotipos: si un favicon no carga, se pone la inicial
   ---------------------------------------------------------------- */
for (const img of document.querySelectorAll('.tile img')) {
  img.addEventListener('error', () => {
    const mono = document.createElement('span');
    mono.className = 'mono';
    mono.textContent = img.dataset.mono || '·';
    img.replaceWith(mono);
  });
}

/* ----------------------------------------------------------------
   3. Entrada escalonada y salida al tocar un enlace
   ---------------------------------------------------------------- */
const stagger = document.getElementById('stagger');
const reduce  = matchMedia('(prefers-reduced-motion: reduce)');

function reveal() {
  stagger.classList.remove('is-hiding');
  requestAnimationFrame(() => stagger.classList.add('is-shown'));
}
window.addEventListener('pageshow', reveal);
if (document.fonts) document.fonts.ready.then(reveal);

for (const a of document.querySelectorAll('a.link')) {
  a.addEventListener('click', (e) => {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (reduce.matches) return;
    e.preventDefault();
    stagger.classList.remove('is-shown');
    stagger.classList.add('is-hiding');
    setTimeout(() => { location.href = a.href; }, 200);
  });
}
</script>
