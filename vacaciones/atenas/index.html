<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5037f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grecia">
<title>Grecia 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235037f9'/%3E%3Cpath d='M12 26 L32 14 L52 26Z M15 28h34v4H15z M18 34h5v16h-5z M29.5 34h5v16h-5z M41 34h5v16h-5z M13 52h38v4H13z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f8f8; --ink:#2c292f; --acc:#5037f9;
  --surface:#ffffff; --line:rgba(44,41,47,.10); --line-strong:rgba(44,41,47,.18);
  --muted:rgba(44,41,47,.62); --soft:rgba(80,55,249,.08);
  --blue:#54BBEE; --pink:#FF1866; --yellow:#FFE14D; --green:#036635; --lime:#8FC31F;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1); --ease-inout:cubic-bezier(.77,0,.175,1);
  --tab-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@supports (color: color(display-p3 1 1 1)){ :root{ --acc: color(display-p3 .31 .2 1); --soft: color(display-p3 .31 .2 1 / .08); --blue: color(display-p3 .38 .73 .94); --pink: color(display-p3 1 .14 .42); --yellow: color(display-p3 1 .89 .32); --green: color(display-p3 .11 .39 .22); --lime: color(display-p3 .58 .76 .25); } }
@view-transition{navigation:auto}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:580;margin:0;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:6px}
.ico{display:block;flex:none;width:44px;height:44px}
.li .ico{width:40px;height:40px}
.card .row > .ico{width:60px;height:60px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- estructura ---------- */
.app{min-height:100dvh}
.side{display:none}
main{padding:0 0 calc(var(--tab-h) + var(--safe-b) + 24px)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(248,248,248,.92);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);padding:calc(var(--safe-t) + 14px) 18px 12px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:1.35rem}
.topbar .sub{font-size:.85rem;color:var(--muted)}

/* barra inferior (móvil) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b);height:calc(var(--tab-h) + var(--safe-b))}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:500}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--acc)}

/* ---------- héroe (Ahora) ---------- */
.hero{background:var(--acc);color:#fff;padding:calc(var(--safe-t) + 22px) 0 64px}
.hero .wrap{display:flex;gap:16px;align-items:flex-end;justify-content:space-between}
.hero .date{font-size:.95rem;opacity:.85}
.hero h1{font-size:2.3rem;margin-top:6px}
.hero .daytitle{font-size:1.05rem;margin-top:4px;opacity:.92}
.hero .dayn{font-size:.85rem;opacity:.8;margin-top:12px}
.hero .ico{width:96px;height:96px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18))}
.heroico{display:block;flex:none}
.lift{margin-top:-44px;position:relative}
.sim{background:#2c292f;color:#fff;font-size:.82rem;padding:8px 18px;text-align:center}
.sim a{color:#fff}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border-radius:18px;border:1px solid var(--line);padding:16px;margin:0 0 14px}
.card.flat{box-shadow:none}
.card.raised{box-shadow:0 10px 30px -12px rgba(44,41,47,.22);border-color:transparent}
.card h2{font-size:1.15rem}
.label{font-size:.82rem;color:var(--muted);font-weight:500}
.sect{margin:26px 0 10px;font-size:1.05rem}
.row{display:flex;gap:14px;align-items:center}
.grow{flex:1;min-width:0}

/* tarjeta de reservación */
.res{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.res .ico{width:56px;height:56px}
.res h3{font-size:1.05rem}
.res .when{font-size:.88rem;color:var(--muted)}
.res .chev{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--acc);vertical-align:2px;margin-left:6px}
.past{opacity:.5}

/* códigos grandes */
.codes{display:grid;grid-template-columns:1fr auto;gap:10px 18px;margin-top:14px}
.codes .code{min-width:0}
.codes .v{font-size:1.75rem;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.1;word-break:break-all}
.codes .v.small{font-size:1.15rem}
.copy{border:0;background:none;padding:0;color:var(--acc);font-size:.8rem;font-weight:600}

/* botones de acción */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 15px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:550;font-size:.93rem}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--acc);color:#fff;border-color:transparent}
.btn.ghost{border-color:transparent;background:var(--soft);color:var(--acc)}

/* ---------- línea del tiempo ---------- */
.day{margin:0 0 8px}
.dayhead{position:sticky;top:calc(var(--safe-t) + 63px);z-index:5;background:var(--bg);padding:16px 0 8px;display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.dayhead h2{font-size:1.1rem}
.dayhead .city{font-size:.88rem;color:var(--muted)}
.day.today .dayhead h2::after{content:"Hoy";margin-left:8px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--acc);color:#fff;vertical-align:3px}
.day.done{opacity:.55}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:83px;top:8px;bottom:8px;width:2px;background:var(--line)}
.it{display:grid;grid-template-columns:52px 44px 1fr;gap:12px;padding:10px 0;position:relative}
.it .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem;padding-top:10px;text-align:right}
.it .tm small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.it .ico{width:44px;height:44px;position:relative;z-index:1;background:var(--bg);border-radius:12px}
.it .body{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.it h3{font-size:.99rem}
.it p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}
.it .mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.it .mini a,.it .mini button{font-size:.82rem;font-weight:600;color:var(--acc);text-decoration:none;background:var(--soft);border:0;border-radius:8px;padding:5px 10px}
.it.now .body{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.it.now .tm{color:var(--acc)}
.it.over{opacity:.5}
.gem{font-size:.72rem;font-weight:600;color:var(--acc);margin-left:6px}

/* siguiente */
.next .when{font-size:.9rem;color:var(--acc);font-weight:600}
.next h2{margin-top:2px}

/* ---------- comer ---------- */
.phrase{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 10px}
.phrase .ico{width:64px;height:64px}
.phrase .gr{font-size:1.15rem;font-weight:580;line-height:1.25}
.phrase .es{font-size:.85rem;color:var(--muted);margin-top:3px}
.phrase.main{padding:20px 18px;border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.phrase.main .ico{width:92px;height:92px}
.phrase.main .gr{font-size:1.45rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:550;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li h3{font-size:.98rem}
.li p{margin:2px 0 0;font-size:.86rem;color:var(--muted)}
.li .go{flex:none;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--acc)}
.li .go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.two{display:grid;gap:10px}
.note{font-size:.9rem}
.note b{font-weight:600}
.note.safe{border-left:5px solid var(--lime)}
.note.safe b{color:var(--green);text-decoration:underline var(--lime);text-decoration-thickness:2px;text-underline-offset:.22em}

/* ---------- lugares ---------- */
.form{display:grid;gap:10px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:11px 12px;font-size:16px}
.form textarea{min-height:64px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(44,41,47,.06);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:550}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(44,41,47,.15)}
.form .two{grid-template-columns:1fr 1fr}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line-strong);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.check svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.li.visited h3{text-decoration:line-through;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:.8rem;padding:6px}
.empty{text-align:center;padding:22px 14px;color:var(--muted)}
.empty .ico{width:72px;height:72px;margin:0 auto 8px}

/* ---------- hoja de detalle ---------- */
.backdrop{position:fixed;inset:0;background:rgba(44,41,47,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:22px 22px 0 0;max-height:94dvh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:0 0 calc(var(--safe-b) + 22px);overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line-strong);margin:9px auto 0}
.sheet .shead{position:sticky;top:0;background:var(--bg);padding:10px 18px 12px;display:flex;align-items:center;gap:14px;z-index:2}
.sheet .shead .ico{width:64px;height:64px}
.sheet .shead h2{font-size:1.35rem}
.close{margin-left:auto;flex:none;width:38px;height:38px;border-radius:50%;border:0;background:rgba(44,41,47,.08);display:grid;place-items:center}
.close svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round}
.sbody{padding:0 18px}
.facts{margin:0;padding:0}
.facts div{padding:11px 0;border-top:1px solid var(--line)}
.facts dt{font-size:.8rem;color:var(--muted);font-weight:500}
.facts dd{margin:2px 0 0;font-size:.95rem}
.gr-addr{font-size:1.05rem;font-weight:550}
.leg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.leg .ap{font-size:1.6rem;font-weight:600;letter-spacing:.02em}
.leg .t{font-size:.86rem;color:var(--muted)}
.leg .mid{text-align:center;font-size:.8rem;color:var(--muted)}
.leg .r{text-align:right}

/* ---------- pantalla grande ---------- */
.big{position:fixed;inset:0;z-index:60;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--safe-t) + 24px) 22px calc(var(--safe-b) + 24px)}
.big.open{display:flex}
.big .ico{width:min(56vw,46vh);height:min(56vw,46vh)}
.big .gr{font-size:clamp(2.1rem,9.5vw,5.2rem);font-weight:600;line-height:1.1;margin-top:10px;letter-spacing:-.01em;max-width:18ch}
.big .es{font-size:clamp(1rem,4.2vw,1.5rem);color:var(--muted);margin-top:16px}
.big .say{font-size:clamp(.9rem,3.6vw,1.2rem);color:var(--acc);margin-top:6px}
.big .close{position:absolute;top:calc(var(--safe-t) + 14px);right:14px;width:46px;height:46px}
@media (orientation:landscape) and (max-height:520px){
  .big{flex-direction:row;gap:28px;text-align:left}
  .big .ico{width:38vh;height:38vh}
  .big .gr{font-size:clamp(1.8rem,6vw,3.6rem)}
}

/* ---------- candado ---------- */
.lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.lock .box{max-width:380px;margin:0 auto;width:100%}
.lock .ico{width:120px;height:120px;margin:0 0 14px -8px}
.lock h1{font-size:2rem}
.lock p{color:var(--muted);margin:8px 0 18px}
.lock input{width:100%;border:1px solid var(--line-strong);border-radius:14px;padding:14px;font-size:18px;background:#fff}
.lock .btn{width:100%;justify-content:center;margin-top:10px;min-height:50px}
.lock .err{color:#c21a2e;font-size:.9rem;min-height:1.4em;margin-top:8px}

.foot{font-size:.82rem;color:var(--muted);text-align:center;padding:24px 0 8px}
.foot button{border:0;background:none;color:var(--acc);font-weight:600;font-size:.82rem}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:.2s;z-index:70;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- acentos ---------- */
.wavy{text-decoration:underline wavy var(--blue);text-decoration-thickness:1.5px;text-underline-offset:.28em}
.ul{text-decoration:underline var(--blue);text-decoration-thickness:2px;text-underline-offset:.22em}
.dbl{text-decoration:underline double var(--pink);text-decoration-thickness:2px;text-underline-offset:.22em}
.hl{background:linear-gradient(transparent 56%, var(--yellow) 56%);padding:0 .1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.it .mini a,.it .mini button{background:none;color:var(--ink);padding:4px 2px;border-radius:4px;text-decoration:underline var(--blue);text-decoration-thickness:2px;text-underline-offset:.24em}
.gem{color:var(--ink);font-weight:550;text-decoration:underline wavy var(--blue);text-decoration-thickness:1.3px;text-underline-offset:.3em}
.facts dt.alert{color:var(--ink);font-weight:600}
.facts dt.alert span{text-decoration:underline double var(--pink);text-decoration-thickness:2px;text-underline-offset:.22em}

/* ---------- pago ---------- */
.pay{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:650;border-radius:999px;padding:3px 10px 3px 8px;white-space:nowrap;view-transition-class:pay}
.pay svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pay.pagado{background:color-mix(in srgb,var(--lime) 26%,#fff);color:var(--green)}
.pay.confirmar{background:var(--yellow);color:var(--ink)}
.pay.porpagar{background:color-mix(in srgb,var(--pink) 12%,#fff);color:#b30d45}
.res .pays{margin-top:6px}
.paycard{display:grid;gap:10px}
.paycard .big-status{display:flex;align-items:center;gap:10px}
.paycard .big-status .pay{font-size:.95rem;padding:6px 14px 6px 11px}
.paycard .big-status .pay svg{width:16px;height:16px}
.paycard p{margin:0;font-size:.92rem}

/* ---------- pedir ---------- */
.jump{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.jump a{flex:none;text-decoration:none;color:var(--ink);font-weight:550;font-size:.9rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface)}
.group-t{font-size:.85rem;color:var(--muted);font-weight:600;margin:16px 0 8px}
.dishes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.dishes{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1180px){.dishes{grid-template-columns:repeat(4,1fr)}}
.dish{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px 12px;transition:transform .16s var(--ease-out),border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.dish .ico{width:76px;height:76px;margin-bottom:2px;pointer-events:none}
.dish-hit{position:absolute;inset:0;border:0;background:none;border-radius:18px;padding:0;z-index:0}
.dish .count,.dish .minus{z-index:2}
.dish > span{pointer-events:none}
.icowrap{display:block;position:relative}
.sheet .shead,.sheet .grab{touch-action:none}
[id^=sec-]{scroll-margin-top:84px}
#big{view-transition-name:big-sheet}
.dish .es{font-weight:600;font-size:.92rem;line-height:1.2}
.dish .gr{font-size:.82rem;color:var(--muted)}
.dish .nt{font-size:.74rem;color:var(--muted);margin-top:4px;line-height:1.25}
.dish.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dish .count{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:13px;background:var(--acc);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center;padding:0 7px;transition:transform .28s cubic-bezier(.34,1.56,.64,1),opacity .2s}
@starting-style{.dish .count{transform:scale(.6);opacity:0}}
.dish .minus{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(44,41,47,.08);display:grid;place-items:center;padding:0;transition:transform .16s var(--ease-out),opacity .2s}
@starting-style{.dish .minus{transform:scale(.6);opacity:0}}
.dish .minus svg{width:14px;height:14px;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.orderbar{position:sticky;bottom:calc(var(--tab-h) + var(--safe-b) + 10px);z-index:15;margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 16px 30px -12px rgba(44,41,47,.45);transition:transform .3s var(--ease-out),opacity .3s}
@starting-style{.orderbar{transform:translateY(16px);opacity:0}}
.orderbar .n{font-weight:600}
.orderbar .clear{border:0;background:none;color:rgba(255,255,255,.7);font-size:.85rem;margin-left:auto}
.orderbar .btn.primary{background:#fff;color:var(--ink)}
.big.order{justify-content:flex-start;overflow:auto;text-align:left;align-items:stretch}
.big.order .oh .gr{font-size:clamp(1.6rem,7vw,3rem);margin:0;max-width:none}
.big.order .oh .es{margin-top:4px}
.orow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.orow .ico{width:clamp(56px,16vw,96px);height:clamp(56px,16vw,96px)}
.orow .q{font-size:clamp(1.6rem,7vw,2.8rem);font-weight:700;color:var(--acc);margin-right:8px}
.orow .g{font-size:clamp(1.6rem,7vw,2.8rem);font-weight:600;line-height:1.1}
.orow .m{font-size:clamp(1.2rem,5vw,1.9rem);font-weight:600;display:inline-block;margin-top:4px}
.orow .s{font-size:.95rem;color:var(--muted);margin-top:4px}
.ofoot{display:flex;align-items:center;gap:14px;border-top:2px solid var(--ink);padding-top:14px;margin-top:6px}
.ofoot .ico{width:clamp(64px,18vw,104px);height:clamp(64px,18vw,104px)}
.ofoot .g{font-size:clamp(1.4rem,6vw,2.4rem);font-weight:700;line-height:1.12}

/* ---------- movimiento ---------- */
#main{view-transition-name:main}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-group(main){animation:none}
::view-transition-old(main){animation:vt-out 160ms var(--ease-out) both}
::view-transition-new(main){animation:vt-in 300ms var(--ease-out) both}
@keyframes vt-out{to{opacity:0;transform:translateX(calc(var(--vt-dir,1) * -20px));filter:blur(3px)}}
@keyframes vt-in{from{opacity:0;transform:translateX(calc(var(--vt-dir,1) * 28px));filter:blur(3px)}}
::view-transition-group(focus-ico){animation-duration:460ms;animation-timing-function:var(--ease-drawer)}
::view-transition-group(big-sheet){animation:none}
::view-transition-new(big-sheet){animation:big-in 320ms var(--ease-out) both}
::view-transition-old(big-sheet){animation:big-out 220ms var(--ease-out) both}
@keyframes big-in{from{opacity:0;transform:scale(.97)}}
@keyframes big-out{to{opacity:0;transform:scale(.98)}}
::view-transition-old(*.pay){animation:pay-out 180ms var(--ease-out) both}
::view-transition-new(*.pay){animation:pay-in 260ms var(--ease-out) both}
@keyframes pay-out{to{opacity:0;filter:blur(4px);transform:translateY(-4px)}}
@keyframes pay-in{from{opacity:0;filter:blur(4px);transform:translateY(4px)}}
::view-transition-group(trip-ico){animation-duration:520ms;animation-timing-function:var(--ease-drawer)}

.btn,.chip,.phrase,.res,.check,.jump a,.go{transition:transform .16s var(--ease-out),background-color .2s,box-shadow .2s,border-color .2s}
.btn:active,.chip:active,.phrase:active,.dish:active,.res:active,.check:active,.jump a:active,.go:active,.close:active{transform:scale(.97)}
.copy{transition:color .2s}
.copy.ok{color:var(--green)}
.intro .hero h1,.intro .hero .date,.intro .hero .daytitle,.intro .hero .dayn,.intro .hero .ico,.intro .lift > *:nth-child(-n+3){animation:rise 640ms var(--ease-out) both}
.intro .hero .date{animation-delay:0ms}.intro .hero h1{animation-delay:50ms}.intro .hero .daytitle{animation-delay:100ms}.intro .hero .dayn{animation-delay:140ms}
.intro .hero .ico{animation:float-in 760ms var(--ease-out) 120ms both}
.intro .lift > *:nth-child(1){animation-delay:180ms}.intro .lift > *:nth-child(2){animation-delay:230ms}.intro .lift > *:nth-child(3){animation-delay:280ms}
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
@keyframes float-in{from{opacity:0;transform:translateY(14px) scale(.92) rotate(-4deg);filter:blur(6px)}}
.it.now .ico{overflow:visible}
.it.now .icowrap{position:relative}
.it.now .icowrap::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:2px solid var(--acc);opacity:0;animation:pulse 2.4s var(--ease-out) infinite}
@keyframes pulse{0%{opacity:.55;transform:scale(.9)}70%{opacity:0;transform:scale(1.18)}100%{opacity:0}}
.backdrop{transition:opacity .4s var(--ease-out)}
.sheet{transition:transform .5s var(--ease-drawer)}
.sheet.dragging{transition:none}
.big{transition:opacity .25s var(--ease-out)}
@starting-style{.big.open{opacity:0}}
.toast{transition:opacity .2s var(--ease-out),transform .3s var(--ease-out)}

/* ---------- escritorio ---------- */
@media (min-width:980px){
  .app{display:grid;grid-template-columns:270px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;padding:28px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .side .ttl{font-size:1.35rem;font-weight:580;line-height:1.2}
  .side .dates{color:var(--muted);font-size:.9rem;margin:4px 0 26px}
  .side .ico{width:84px;height:84px;margin:0 0 12px -6px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:550;margin-bottom:2px}
  .side nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .side nav a[aria-current="page"]{background:var(--soft);color:var(--acc)}
  .side .now{margin-top:auto;font-size:.85rem;color:var(--muted)}
  .tabs{display:none}
  main{padding-bottom:40px}
  .wrap{padding:0 32px}
  .topbar{padding:22px 32px 14px}
  .topbar h1{font-size:1.6rem}
  .hero{padding-top:36px}
  .dayhead{top:72px}
  .sheet{left:auto;top:0;bottom:0;width:460px;max-height:none;border-radius:0;transform:translateX(105%);border-left:1px solid var(--line)}
  .sheet .grab{display:none}
  .sheet .shead{padding-top:22px}
  .two.cols{grid-template-columns:1fr 1fr}
  .toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>

/* ---------- tiempo ---------- */
const params = new URLSearchParams(location.search);
function now(){
  const sim = params.get("ahora");
  if (sim) { const d = new Date(/[+-]\d\d:\d\d$|Z$/.test(sim) ? sim : sim + (sim.length===16?":00":"") + "+02:00"); if(!isNaN(d)) return d; }
  return new Date();
}
const partsFmt = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function athens(d){ const p=Object.fromEntries(partsFmt.formatToParts(d).map(x=>[x.type,x.value])); return {key:`${p.year}-${p.month}-${p.day}`, hm:`${p.hour}:${p.minute}`}; }
const dayFmt = new Intl.DateTimeFormat("es-MX",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});
const dayShort = new Intl.DateTimeFormat("es-MX",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const dayLong = key => cap(dayFmt.format(new Date(key+"T12:00:00Z")));
const dayAbbr = key => cap(dayShort.format(new Date(key+"T12:00:00Z")).replace(/\./g,""));
function rel(ms){
  const past = ms < 0; let m = Math.round(Math.abs(ms)/60000);
  let s; if (m < 1) s = "un momento"; else if (m < 60) s = m+" min"; else if (m < 60*24) { const h=Math.floor(m/60), r=m%60; s = h+" h"+(r?" "+r+" min":""); } else { const d=Math.round(m/1440); s = d+(d===1?" día":" días"); }
  return past ? "hace "+s : "en "+s;
}

/* ---------- datos ---------- */
let D = null, RES = {}, BARS = {};
function index(){
  RES = Object.fromEntries(D.reservations.map(r=>[r.id,r]));
  BARS = Object.fromEntries(D.bars.map(b=>[b.id,b]));
  D.days.forEach(day => day.items.forEach((it,i,arr) => {
    it._t = new Date(it.t).getTime();
    it._end = it.end ? new Date(it.end).getTime() : (arr[i+1] ? new Date(arr[i+1].t).getTime() : it._t + 90*60000);
    it._day = day.date;
  }));
  D.reservations.forEach(r => { r._s = new Date(r.start).getTime(); r._e = new Date(r.end).getTime(); });
}

/* ---------- cifrado ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pass){
  const p = JSON.parse(PAYLOAD);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.salt), iterations:p.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, key, b64(p.data));
  return JSON.parse(new TextDecoder().decode(buf));
}

/* ---------- vista: Ahora ---------- */
function phase(t){
  const first = Math.min(...D.reservations.map(r=>r._s)), last = Math.max(...D.reservations.map(r=>r._e));
  if (t < first) return "antes"; if (t > last) return "despues"; return "durante";
}
function stayFor(key){ return D.reservations.find(r => r.kind==="stay" && r.checkinDay <= key && key < r.checkoutDay); }
function stayLeaving(key, t){ return D.reservations.find(r => r.kind==="stay" && r.checkoutDay === key && t < r._e); }
function flightNow(t){ return D.reservations.find(r => r.kind==="flight" && t >= r._s - 3*3600e3 && t <= r._e); }
function allItems(){ return D.days.flatMap(d => d.items); }

function resCard(r, opts={}){

  const live = t>=r._s && t<=r._e;
  return `<a class="res card ${opts.raised?'raised':''} ${!live && t>r._e && !opts.keep ? 'past':''}" href="#r/${r.id}">

}

function codeVal(c){ return c.label==="PIN" ? `<span class="hl">${esc(c.value)}</span>` : esc(c.value); }
function itemActions(it){

function itemRow(it, t){

const PENDING = [
  "Hacer check-in en línea con Lufthansa",
  "Empacar solo equipaje de mano: 8 kg + artículo personal",
  "Comprar boleto de la Acrópolis para el lunes 2, 08:00 (hhticket.gr)",

  "Descargar mapas sin conexión de Atenas, Nafplio y Egina"
];
function renderAhora(){
  const d = now(), t = d.getTime(), A = athens(d), ph = phase(t);
  const dayIdx = D.days.findIndex(x => x.date === A.key);
  const day = D.days[dayIdx];
  let heroIcon = "temple", heroTitle = "Grecia", heroSub = D.trip.title, heroN = "";
  if (ph === "antes") {
    const dep = D.reservations[0]._s, days = Math.ceil((dep - t)/86400e3);
    heroTitle = days <= 1 ? "Mañana sales" : `Faltan ${days} días`; heroSub = "Salida el viernes 30 de octubre, 21:00, desde CDMX"; heroIcon = "plane";
  } else if (ph === "despues") {
    heroTitle = "De vuelta en casa"; heroSub = "Todo el viaje sigue aquí para consultarlo."; heroIcon = "key";
  } else if (day) {
    heroTitle = day.city; heroSub = day.title; heroN = `Día ${dayIdx+1} de ${D.days.length}`;
    heroIcon = day.items.find(i => t < i._end)?.icon || "temple";
  }
  let html = `${simBar()}<header class="hero"><div class="wrap"><div><div class="date">${esc(ph==="durante"?dayLong(A.key):"")}${ph==="durante"?` · ${A.hm}`:""}</div><h1>${esc(heroTitle)}</h1><div class="daytitle">${esc(heroSub)}</div>${heroN?`<div class="dayn">${heroN}</div>`:""}</div><span class="heroico" style="view-transition-name:trip-ico">${ico(heroIcon)}</span></div></header><div class="wrap lift">`;

  // Vuelo en curso
  const fl = flightNow(t);
  if (fl) html += flightCard(fl, t >= fl._s ? "Vuelo en curso" : "Vuelo de hoy");

  // Siguiente
  const nxt = allItems().find(i => i._t > t);
  const cur = allItems().find(i => i._t <= t && t < i._end && i._day === A.key);
  if (ph === "durante" && cur) html += nextCard(cur, "Ahora", t);
  if (nxt && ph !== "despues") html += nextCard(nxt, rel(nxt._t - t), t);

  // Hotel
  if (ph === "durante") {
    const leaving = stayLeaving(A.key, t), tonight = stayFor(A.key);
    if (leaving && leaving !== tonight) html += stayCard(leaving, `Sales hoy de este hotel`);
    if (tonight) html += stayCard(tonight, "Duermes hoy en");
  }

  if (ph === "antes") {
    const done = store.get(KEY_CHECK, {});
    html += `<h2 class="sect">Antes de salir</h2><div class="list">${PENDING.map((p,i)=>`<div class="li ${done[i]?'visited':''}"><button class="check" aria-pressed="${!!done[i]}" data-pend="${i}" aria-label="Marcar">${line.tick}</button><div class="grow"><h3>${esc(p)}</h3></div></div>`).join("")}</div>`;
    html += `<h2 class="sect">Tu primer vuelo</h2>` + flightCard(D.reservations[0], "Vuelo de ida");
  }

  // Hoy
  if (day) html += `<h2 class="sect">Hoy</h2><ul class="tl">${day.items.map(i=>itemRow(i,t)).join("")}</ul>`;
  const tom = D.days[dayIdx+1];
  if (day && tom) html += `<h2 class="sect">Mañana: ${esc(tom.title)}</h2><a class="res card" href="#plan/${tom.date}">${ico(tom.items[0].icon)}<div class="grow"><h3>${esc(tom.items[0].time)} ${esc(tom.items[0].title)}</h3><div class="when">${esc(dayLong(tom.date))}, ${esc(tom.city)}</div></div>${line.chev}</a>`;
  if (ph === "despues") html += `<a class="res card" href="#plan">${ico("temple")}<div class="grow"><h3>Ver el plan completo</h3></div>${line.chev}</a>`;
  html += footer() + `</div>`;
  return html;
}

  let b = `<div class="grab"></div><div class="shead">${ico(r.icon)}<div class="grow"><h2 id="sheet-title">${esc(r.title)}</h2><div class="muted" style="font-size:.9rem">${esc(r.subtitle)}</div></div><button class="close" data-close aria-label="Cerrar">${line.x}</button></div><div class="sbody">`;
  b += `<div class="card"><div class="label">${esc(r.dateLabel)}</div>`;
  if (r.checkin) b += `<div style="margin-top:4px">${esc(r.checkin)}. ${esc(r.checkout)}.</div>`;
  b += `<div class="codes">${r.codes.map(c=>`<div class="code"><div class="label">${esc(c.label)}</div><div class="v ${c.big?'':'small'}">${codeVal(c)}</div></div><div><button class="copy" data-copy="${esc(c.value.replace(/\s/g,''))}">Copiar</button></div>`).join("")}</div></div>`;
  if (r.pay) { const paid = markedPaid(r);
    b += `<div class="card paycard"><div class="label">Pago</div><div class="big-status">${payPill(r, "pay-"+r.id)}</div><p>${esc(r.pay.note)}${paid?" Lo marcaste como pagado en este dispositivo.":""}</p>${r.pay.status!=="pagado"?`<div><button class="btn ${paid?'':'primary'}" data-paid="${r.id}">${paid?"Quitar marca de pagado":"Ya está pagado"}</button></div>`:""}</div>`; }
  if (r.legs) b += `<div class="card">${r.legs.map(l=>legRow(l)+`<div class="t muted" style="font-size:.82rem;margin:-6px 0 6px">${esc(l.fromName)} → ${esc(l.toName)}. ${esc(l.plane)}.</div>`).join("")}<div class="muted" style="font-size:.88rem;margin-top:6px">${esc(r.connection)}</div></div>`;
  if (r.address) b += `<div class="card"><div class="label">Dirección</div><div style="margin-top:2px">${esc(r.address)}</div><div class="gr-addr" lang="el" style="margin-top:6px">${esc(r.addressGr)}</div><div class="label" style="margin-top:10px">Teléfono</div><div><a href="${tel(r.phone)}">${esc(r.phone)}</a></div>
    <div class="actions"><a class="btn primary" href="${mapsDir(r.lat,r.lng)}" target="_blank" rel="noopener">${line.route}Cómo llegar</a><a class="btn" href="${mapsLL(r.lat,r.lng)}" target="_blank" rel="noopener">${line.map}Ver en Maps</a><a class="btn" href="${tel(r.phone)}">${line.call}Llamar</a><button class="btn" data-taxi="${r.id}">${line.taxi}Para el taxi</button></div></div>`;
  if (r.facts) b += `<dl class="facts">${r.facts.map(([k,v])=>`<div><dt${ALERT_KEYS.has(k)?' class="alert"':''}><span>${esc(k)}</span></dt><dd>${esc(v)}</dd></div>`).join("")}</dl>`;
  if (r.links) b += `<div class="actions">${r.links.map(l=>`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${line.link}${esc(l.label)}</a>`).join("")}</div>`;
  b += `</div>`;
  const s = $("#sheet"); const top = s.scrollTop; s.innerHTML = b; s.scrollTop = keepScroll ? top : 0;
  s.classList.add("open"); $("#backdrop").classList.add("open");
  setTimeout(()=>s.querySelector(".close")?.focus({preventScroll:true}), 50);
}
function closeSheet(){ const s=$("#sheet"); s.classList.remove("open","dragging"); s.style.transform=""; const bd=$("#backdrop"); bd.classList.remove("open"); bd.style.opacity=""; }

/* ---------- pantalla grande ---------- */
let wake = null, focusSrc = null;
function openBigNow(html, cls=""){
  const b = $("#big"); b.className = "big open " + cls; b.innerHTML = html + `<button class="close" data-closebig aria-label="Cerrar">${line.x}</button>`; b.scrollTop = 0;
  try{ navigator.wakeLock?.request("screen").then(w => wake = w).catch(()=>{}); }catch(e){}
}
function openBig(html, cls, srcEl){
  focusSrc = srcEl?.querySelector(".ico") || null;
  if (focusSrc) focusSrc.style.viewTransitionName = "focus-ico";
  vt(() => {
    if (focusSrc) focusSrc.style.viewTransitionName = "";
    openBigNow(html, cls);
    const bi = $("#big .focus"); if (bi && focusSrc) bi.style.viewTransitionName = "focus-ico";
  }).then(() => { const bi = $("#big .focus"); if (bi) bi.style.viewTransitionName = ""; });
}
function closeBig(){
  const bi = $("#big .focus"), src = focusSrc && document.contains(focusSrc) ? focusSrc : null;
  if (bi && src) bi.style.viewTransitionName = "focus-ico";
  vt(() => {
    $("#big").className = "big"; try{ wake?.release(); }catch(e){} wake = null;
    if (src) src.style.viewTransitionName = "focus-ico";
  }).then(() => { if (src) src.style.viewTransitionName = ""; });
}
function bigPhrase(id, srcEl){
  const p = D.phrases.find(x=>x.id===id); if (!p) return;
  openBig(`${ico(p.icon,"focus")}<div><div class="gr" lang="el">${esc(p.gr)}</div><div class="say">${esc(p.say)}</div><div class="es">${esc(p.es)}</div></div>`, "", srcEl);
}
function order(){ return store.get(KEY_ORDER, {}); }
function bigOrder(){
  const o = order(), items = D.dishes.filter(d => o[d.id]);
  if (!items.length) return;
  const rows = items.map(d => `<div class="orow">${ico(d.icon)}<div><div><span class="q">${o[d.id]} ×</span><span class="g" lang="el">${esc(d.gr)}</span></div>${d.mod?`<div class="m dbl" lang="el">${esc(d.mod.gr)}</div>`:""}<div class="s">${esc(d.es)}${d.mod?`, ${esc(d.mod.es)}`:""}</div></div></div>`).join("");
  const p0 = D.phrases.find(p => p.id === "sin-lacteos");
  openBig(`<div class="oh"><div class="gr" lang="el">${esc(D.dishesIntro.gr)}</div><div class="es">${esc(D.dishesIntro.es)}</div></div>${rows}<div class="ofoot">${ico("nodairy")}<div><div class="g" lang="el">${esc(p0.gr)}</div><div class="s muted">${esc(p0.es)}</div></div></div>`, "order");
}
function bigTaxi(id, srcEl){
  const r = RES[id]; if (!r) return;
  openBig(`${ico("bed","focus")}<div><div class="gr" lang="el" style="font-size:clamp(1.9rem,8.4vw,4.4rem)">${esc(r.addressGr)}</div><div class="say">${esc(r.title)}</div><div class="es">${esc(r.address)}</div></div>`, "", null);
}

/* ---------- render ---------- */
function shell(){
  const nav = VIEWS.map(v=>`<a href="#${v.id}" data-nav="${v.id}">${v.icon}<span>${v.label}</span></a>`).join("");
  $("#root").innerHTML = `<div class="app"><aside class="side">${ico("temple")}<div class="ttl">${esc(D.trip.title)}</div><div class="dates">30 de octubre al 13 de noviembre de 2026</div><nav>${nav}</nav><div class="now" id="sideclock"></div></aside><main id="main"></main></div><nav class="tabs" aria-label="Secciones">${nav}</nav>`;
}
function render(){
  const R = {ahora:renderAhora, plan:renderPlan, reservas:renderReservas, comer:renderComer, lugares:renderLugares};
  const m = $("#main"), y = (view === lastRendered) ? window.scrollY : null;
  m.innerHTML = (R[view] || renderAhora)();
  if (y !== null) window.scrollTo(0, y);
  lastRendered = view;
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", false) || (a.dataset.nav===view && a.setAttribute("aria-current","page")));
  const sc = $("#sideclock"); if (sc) sc.textContent = `Hora en Grecia: ${athens(now()).hm}`;
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [a, b] = h.split("/");
  if (a === "r") { if (!$("#main").innerHTML) { render(); } openSheet(b); return; }
  closeSheet();
  const prev = view;
  view = VIEWS.some(v=>v.id===a) ? a : "ahora";
  const go = () => {
    lastRendered = null; render();
    if (view === "plan") {
      const target = b ? document.getElementById("d-"+b) : (document.querySelector(".day.today") || null);
      if (target) target.scrollIntoView({block:"start"}); else window.scrollTo(0,0);
    } else if (prev !== view) window.scrollTo(0,0);
  };
  if (prev !== view && $("#main").innerHTML) {
    const ix = id => VIEWS.findIndex(v=>v.id===id);
    document.documentElement.style.setProperty("--vt-dir", ix(view) >= ix(prev) ? 1 : -1);
    vt(go);
  } else go();
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-copy],[data-close],[data-closebig],[data-phrase],[data-taxi],[data-city],[data-type],[data-done],[data-del],[data-idea],[data-pend],[data-lock],[data-export],[data-dish],[data-less],[data-clear],[data-showorder],[data-jump],[data-paid]");
  if (!el) { if (e.target.id === "backdrop") history.back(); return; }
  const d = el.dataset;
  if (d.copy !== undefined) { copy(d.copy, el); }
  else if (d.dish) { const o = order(); o[d.dish] = (o[d.dish]||0) + 1; store.set(KEY_ORDER, o); render(); }
  else if (d.less) { const o = order(); o[d.less] = Math.max(0,(o[d.less]||0) - 1); if (!o[d.less]) delete o[d.less]; store.set(KEY_ORDER, o); render(); }
  else if (d.clear !== undefined) { store.set(KEY_ORDER, {}); render(); }
  else if (d.showorder !== undefined) bigOrder();
  else if (d.jump) { e.preventDefault(); document.getElementById(d.jump)?.scrollIntoView({behavior: reduceMotion.matches ? "auto" : "smooth", block:"start"}); }
  else if (d.paid) { const m = store.get(KEY_PAID,{}); if (m[d.paid]) delete m[d.paid]; else m[d.paid] = true; store.set(KEY_PAID,m); vt(() => { openSheet(d.paid, true); render(); }); }
  else if (d.close !== undefined) history.back();
  else if (d.closebig !== undefined) closeBig();
  else if (d.phrase) bigPhrase(d.phrase, el);
  else if (d.taxi) bigTaxi(d.taxi, el);
  else if (d.city) { cityFilter = d.city; render(); }
  else if (d.type) { newType = d.type; document.querySelectorAll("[data-type]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.type===newType)); }
  else if (d.done !== undefined) { const p = places(); p[+d.done].done = !p[+d.done].done; savePlaces(p); render(); }
  else if (d.del !== undefined) { const p = places(); const [x] = p.splice(+d.del,1); savePlaces(p); render(); toast("Quitado: "+x.name); }
  else if (d.idea) { const i = D.ideas.find(x=>x.name===d.idea); const p = places(); p.unshift({name:i.name, city:i.city, type:i.type, q:i.q, note:"", done:false}); savePlaces(p); render(); toast("Añadido: "+i.name); }
  else if (d.pend !== undefined) { const c = store.get(KEY_CHECK,{}); c[d.pend] = !c[d.pend]; store.set(KEY_CHECK,c); render(); }
  else if (d.lock !== undefined) { if (confirm("¿Bloquear? Tendrás que escribir la clave otra vez.")) { try{ localStorage.removeItem(KEY_PASS); }catch(e){} location.reload(); } }
  else if (d.export !== undefined) { const blob = new Blob([JSON.stringify(places(),null,2)],{type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "lugares-grecia.json"; a.click(); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "addform") return; e.preventDefault();
  const name = $("#f-name").value.trim(); if (!name) return;
  const p = places(); p.unshift({name, type:newType, city:$("#f-city").value, note:$("#f-note").value.trim(), done:false}); savePlaces(p);
  render(); toast("Añadido: "+name);
});
document.addEventListener("change", async e => {
  if (e.target.id !== "f-import" || !e.target.files[0]) return;
  try{ const arr = JSON.parse(await e.target.files[0].text()); if (!Array.isArray(arr)) throw 0; const p = places(); const have = new Set(p.map(x=>x.name.toLowerCase())); arr.forEach(x => x && x.name && !have.has(x.name.toLowerCase()) && p.push(x)); savePlaces(p); render(); toast("Lista importada"); }
  catch(err){ toast("Ese archivo no es una lista de lugares"); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#big").classList.contains("open")) closeBig(); else if ($("#sheet").classList.contains("open")) history.back(); } });
window.addEventListener("hashchange", route);

/* arrastrar la hoja hacia abajo para cerrarla (móvil) */
(() => {
  const sh = $("#sheet"), bd = $("#backdrop"); let drag = null;
  sh.addEventListener("pointerdown", e => {
    if (innerWidth >= 980 || !sh.classList.contains("open")) return;
    if (!e.target.closest(".grab,.shead") || e.target.closest("button,a")) return;
    drag = {y:e.clientY, t:performance.now(), dy:0}; sh.classList.add("dragging"); sh.setPointerCapture(e.pointerId);
  });
  sh.addEventListener("pointermove", e => {
    if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y);
    sh.style.transform = `translateY(${drag.dy}px)`; bd.style.opacity = String(Math.max(0, 1 - drag.dy/420));
  });
  const end = () => {
    if (!drag) return; const v = drag.dy / Math.max(1, performance.now() - drag.t);
    sh.classList.remove("dragging");
    if (drag.dy > 120 || v > .6) history.back(); else { sh.style.transform = ""; bd.style.opacity = ""; }
    drag = null;
  };
  sh.addEventListener("pointerup", end); sh.addEventListener("pointercancel", end);
})();
setInterval(() => { if (!$("#sheet").classList.contains("open") && (view==="ahora" || view==="plan") && !document.activeElement?.matches("input,textarea,select")) render(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && D && (view==="ahora")) render(); });

/* ---------- candado ---------- */
function lockScreen(msg=""){
  $("#root").innerHTML = `<div class="lock"><form class="box" id="lockform"><span style="display:block;view-transition-name:trip-ico;width:120px">${ico("temple")}</span><h1>Grecia 2026</h1><p>Escribe la clave del viaje. Se recuerda en este dispositivo.</p><input type="password" id="pass" autocomplete="current-password" aria-label="Clave" autofocus><button class="btn primary" type="submit">Abrir</button><div class="err" role="alert">${esc(msg)}</div></form></div>`;
  $("#lockform").addEventListener("submit", async ev => {
    ev.preventDefault(); const pass = $("#pass").value;
    try{ D = await decrypt(pass); store.set(KEY_PASS, pass); unlockStart(); }
    catch(err){ lockScreen("Esa clave no abre el viaje. Revisa mayúsculas y vuelve a intentar."); }
  });
}
function start(){
  index(); shell(); route();
  const m = $("#main"); if (view === "ahora" && !reduceMotion.matches) { m.classList.add("intro"); setTimeout(()=>m.classList.remove("intro"), 1400); }
}
function unlockStart(){ vt(start); }
(async () => {
  if (!window.crypto?.subtle) { $("#root").innerHTML = `<div class="lock"><div class="box"><h1>Abre esta página con https</h1><p>El navegador solo puede descifrar los datos en una conexión segura.</p></div></div>`; return; }
  const saved = store.get(KEY_PASS, null);
  if (saved) { try{ D = await decrypt(saved); start(); return; }catch(e){} }
  lockScreen();
})();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
