<style>
:root{--bg:#f8f8f8;--ink:#2c292f;--acc:#5037f9;--blue:#54BBEE;--pink:#FF1866;--yellow:#FFE14D;--muted:rgba(44,41,47,.62);--line:rgba(44,41,47,.10);--ease-out:cubic-bezier(.23,1,.32,1)}
@supports (color: color(display-p3 1 1 1)){:root{--acc:color(display-p3 .31 .2 1);--blue:color(display-p3 .38 .73 .94);--pink:color(display-p3 1 .14 .42);--yellow:color(display-p3 1 .89 .32)}}
@view-transition{navigation:auto}
::view-transition-group(trip-ico){animation-duration:520ms;animation-timing-function:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Albert Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 48px) 20px 64px}
h1{font-weight:580;font-size:clamp(2.4rem,8vw,4rem);letter-spacing:-.02em;margin:0;line-height:1.02}
.by{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:1.1rem;font-weight:500;text-decoration:none;margin:12px 0 40px}
.by .n{text-decoration:underline double var(--pink);text-decoration-thickness:2px;text-underline-offset:.24em}
.by svg{width:28px;height:16px;stroke:var(--pink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--ease-out)}
.by:hover svg{transform:translateX(3px)}
.trips{display:grid;gap:16px}
@media (min-width:720px){.trips{grid-template-columns:1fr 1fr}}
.trip{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;transition:transform .15s}
.trip:hover{transform:translateY(-2px)}
.trip:focus-visible{outline:2.5px solid var(--acc);outline-offset:3px}
.trip .icons{display:flex;gap:4px;margin:-6px 0 14px -6px}
.trip .icons svg{width:72px;height:72px}
.trip h2{font-weight:580;font-size:1.5rem;margin:0}
.trip p{margin:6px 0 0;color:var(--muted)}
.trip .open{display:inline-block;margin-top:16px;color:var(--ink);font-weight:600;text-decoration:underline var(--blue);text-decoration-thickness:2px;text-underline-offset:.24em}
.trip:active{transform:scale(.98)}
h1 .hl{background:linear-gradient(transparent 62%, var(--yellow) 62%);padding:0 .06em}
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(4px)}}
h1,.by,.trip,.soon{animation:rise 620ms var(--ease-out) both}.by{animation-delay:60ms}.trip{animation-delay:120ms}.soon{animation-delay:170ms}
@media (prefers-reduced-motion:reduce){h1,.by,.trip,.soon{animation:none}}
.soon{border:1.5px dashed var(--line);border-radius:22px;padding:22px;color:var(--muted);display:flex;align-items:center}
@media (prefers-reduced-motion:reduce){.trip{transition:none}}
</style>
</head>

<script>

];

</script>
