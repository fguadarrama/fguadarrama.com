<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f8fb">
  <title>Francisco Guadarrama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="identity" aria-label="Francisco Guadarrama">
    <span class="name">Francisco Guadarrama</span>

    <button class="avatar" id="avatar" type="button" aria-label="Abrir fotografía" aria-expanded="false">
      <span class="avatar__orbit" aria-hidden="true"></span>
      <span class="avatar__mask" aria-hidden="true"></span>
      <span class="avatar__tilt" id="avatarTilt">
        <img src="./avatar.webp" alt="Francisco Guadarrama" draggable="false">
        <span class="avatar__shine" aria-hidden="true"></span>
      </span>
    </button>
  </main>

  <div class="viewer" id="viewer" aria-hidden="true">
    <button class="viewer__backdrop" id="viewerBackdrop" type="button" aria-label="Cerrar fotografía"></button>
    <div class="t-opentilt-stage">
      <button class="t-opentilt-card" id="opentilt-card" type="button" aria-label="Cerrar fotografía">
        <img class="t-opentilt-img" src="./avatar.webp" alt="Francisco Guadarrama" draggable="false">
        <canvas class="t-opentilt-canvas" aria-hidden="true"></canvas>
      </button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
