<title>Tarjeta médica de emergencia</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap"><style>
:root{--ink:rgb(37, 40, 40);--sub:rgb(37, 40, 40);--line:rgb(67, 146, 186);--bg:rgb(253, 251, 246);--soft:rgb(253, 251, 246);--red:rgb(235, 21, 78);--green:rgb(45, 103, 78);--greenbg:rgb(253, 251, 246);--blue:rgb(67, 146, 186);--m:"Space Grotesk",system-ui,sans-serif;--s:"Albert Sans",system-ui,sans-serif;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 17px/1.35 var(--m)}
a{color:var(--blue)}a:hover{color:var(--ink)}
main{max-width:680px;margin:0 auto}
.m{font-family:var(--m)}
.t{display:block;font:500 11px/1.45 var(--s);letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.k{display:block;font:700 11px/1.3 var(--s);letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
section{padding:18px 20px;border-bottom:1px solid var(--line)}
h2{font:700 12px/1.2 var(--s);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.top{background:var(--red);color:rgb(253, 251, 246);padding:calc(12px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:14px}
.top svg{flex:none}
.top b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.top .t{color:rgb(253, 251, 246)}
.dnr h1{font-size:clamp(30px,8vw,42px);font-weight:800;line-height:1;color:var(--red);margin-bottom:6px}
.dnr .t{font-size:13px;color:var(--ink)}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));padding:0;background:var(--soft)}
.crit>div{padding:14px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.crit .v{font-size:24px;font-weight:800;line-height:1.1}
.crit .blood{font:700 32px/1 var(--m)}
.crit .don{background:var(--greenbg);color:var(--green)}
.crit .don .k,.crit .don .t{color:var(--green)}
.id{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:start}
.ph{width:112px;aspect-ratio:3/4;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.age{display:flex;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.age .sx{font-size:40px;font-weight:800;line-height:1}
.age .n{font-size:48px;font-weight:800;line-height:1}
.age .t{line-height:1.3;white-space:nowrap;flex:none}
dl{display:grid;gap:10px}
dd{font-size:18px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
dd.m{font-size:17px}
.rx{border-left:3px solid var(--blue)}
.rx h2{color:var(--blue)}
.cond+.cond{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.cond b{font-size:20px;font-weight:800}
.dose{margin-top:6px;padding:8px 10px;background:var(--soft);border-left:3px solid var(--blue);font:700 15px/1.35 var(--m)}
.dose small{font:700 11px var(--m);color:var(--blue);margin-right:8px}
.don2{background:var(--greenbg);color:var(--green);border-left:4px solid var(--green)}
.don2 p{font-size:19px;font-weight:700;line-height:1.25}
.don2 .t{color:var(--green);margin-top:8px}
.reg{margin-top:12px;padding-top:10px;border-top:1px solid var(--green)}
.reg .k{color:var(--green)}
.reg .m{font-size:28px;font-weight:700;letter-spacing:.04em}
.will p{font-size:17px;line-height:1.3}
.will .t{margin-top:4px}
@media(max-width:360px){.id{grid-template-columns:1fr}.ph{width:120px}}


main{overflow-x:clip}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.top b{font-family:var(--s)}
.dnr h1{font-family:var(--m)}
.dose small{font-family:var(--s)}
img,svg{-webkit-user-drag:none}
.top{position:relative;overflow:hidden}
.top::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--blue);transform-origin:left;animation:trace 280ms var(--ease-out) both}
.top svg{animation:badge 240ms var(--ease-out) both}
.crit>div{animation:lift 240ms var(--ease-out) both}
.crit>div:nth-child(2){animation-delay:40ms}.crit>div:nth-child(3){animation-delay:80ms}
.id{animation:lift 240ms var(--ease-out) 40ms both}
.rx{animation:lift 240ms var(--ease-out) 80ms both}
.don2{animation:lift 240ms var(--ease-out) 120ms both}
.will{animation:lift 240ms var(--ease-out) 160ms both}
.reg .m{display:inline-block;animation:settle 280ms var(--ease-out) 160ms both;transform-origin:left center}
@keyframes lift{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes badge{from{transform:scale(.94) rotate(-5deg)}to{transform:scale(1) rotate(0)}}
@keyframes trace{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes settle{from{transform:translateX(6px)}to{transform:translateX(0)}}
@media(hover:hover) and (pointer:fine){.ph img{transition:transform 240ms var(--ease-out)}.ph:hover img{transform:scale(1.025)}.top svg{transition:transform 200ms var(--ease-out)}.top:hover svg{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}.ph:hover img,.top:hover svg{transform:none}}
@media print{html,body{background:rgb(253, 251, 246)!important;color:rgb(37, 40, 40)!important}body>*{display:none!important}body::before{content:'Impresión deshabilitada.';display:block;font:16px sans-serif}}
</style>
