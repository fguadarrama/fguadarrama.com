:root{--ink:#0a0a0a;--sub:#2b2b2b;--line:#0000002e;--bg:#fff;--soft:#f3f3f3;--red:#c10000;--green:#007a35;--greenbg:#dff5e7;--blue:#1d3fbf;--m:"Space Grotesk",system-ui,sans-serif;--s:"Albert Sans",system-ui,sans-serif;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 17px/1.35 var(--m)}
a{color:var(--blue)}a:hover{color:var(--ink)}
main{max-width:680px;margin:0 auto}
.m{font-family:var(--m)}
.t{display:block;font:500 11px/1.45 var(--s);letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.k{display:block;font:700 11px/1.3 var(--s);letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
section{padding:18px 20px;border-bottom:1px solid var(--line)}
h2{font:700 12px/1.2 var(--s);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.top{background:var(--red);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:14px}
.top svg{flex:none}
.top b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.top .t{color:#fff}
.dnr h1{font-size:clamp(30px,8vw,42px);font-weight:800;line-height:1;color:var(--red);margin-bottom:6px}
.dnr .t{font-size:13px;color:var(--ink)}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));padding:0;background:var(--soft)}
.crit>div{padding:14px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.crit .v{font-size:24px;font-weight:800;line-height:1.1}
.crit .blood{font:700 32px/1 var(--m)}
.crit .don{background:var(--greenbg);color:var(--green)}
.crit .don .k,.crit .don .t{color:var(--green)}
.id{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:start}
.ph{width:112px;aspect-ratio:3/4;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.age{display:flex;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.age .sx{font-size:40px;font-weight:800;line-height:1}
.age .n{font-size:48px;font-weight:800;line-height:1}
.age .t{line-height:1.3;white-space:nowrap;flex:none}
dl{display:grid;gap:10px}
dd{font-size:18px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
dd.m{font-size:17px}
.rx{border-left:3px solid var(--blue)}
.rx h2{color:var(--blue)}
.cond+.cond{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.cond b{font-size:20px;font-weight:800}
.dose{margin-top:6px;padding:8px 10px;background:var(--soft);border-left:3px solid var(--blue);font:700 15px/1.35 var(--m)}
.dose small{font:700 11px var(--m);color:var(--blue);margin-right:8px}
.don2{background:var(--greenbg);color:var(--green);border-left:4px solid var(--green)}
.don2 p{font-size:19px;font-weight:700;line-height:1.25}
.don2 .t{color:var(--green);margin-top:8px}
.reg{margin-top:12px;padding-top:10px;border-top:1px solid var(--green)}
.reg .k{color:var(--green)}
.reg .m{font-size:28px;font-weight:700;letter-spacing:.04em}
.will p{font-size:17px;line-height:1.3}
.will .t{margin-top:4px}
@media(max-width:360px){.id{grid-template-columns:1fr}.ph{width:120px}}


html{background:#eeeef0}
body{padding:28px 16px 40px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
main{background:#fff;border:1px solid #dfdfe3;border-radius:24px;overflow:hidden;box-shadow:0 12px 48px #1919220c}
.top{padding:22px 26px;background:#b91425;gap:14px}
.top b{font-family:var(--s);font-size:20px;font-weight:700;letter-spacing:-.025em}
.top .t{font-size:10px;letter-spacing:.015em;margin-top:5px;opacity:.85}
section{padding:22px 26px;border-color:#e5e5e9}
.dnr{background:#fff6f6;border-bottom:1px solid #f1d4d8;padding:25px 26px}
.dnr h1{font-family:var(--m);font-size:clamp(36px,8.5vw,50px);font-weight:700;letter-spacing:-.055em;color:#b91425;line-height:1.06}
.dnr .t{font-size:11px;letter-spacing:.045em;margin-top:8px}
.crit{grid-template-columns:.72fr 1.4fr 1fr;background:#fafafb}
.crit>div{padding:18px 20px}
.k{font-size:10px;letter-spacing:.085em;font-weight:700;color:#64646d;margin-bottom:7px}
.t{font-size:10px;letter-spacing:.025em;line-height:1.55;color:#65656f}
h2{font-size:11px;font-weight:700;letter-spacing:.12em;margin-bottom:16px}
.crit .v{font-size:21px;font-weight:600;letter-spacing:-.035em;line-height:1.18;margin-bottom:5px}
.crit .blood{font-size:35px;letter-spacing:-.05em;margin-bottom:5px}
.crit .don{background:#ecf7ef;color:#21623c}
.id{gap:24px;grid-template-columns:112px minmax(0,1fr)}
.ph{border-radius:12px;background:#eeeef0;border:0}
img,svg{-webkit-user-drag:none;user-drag:none}
.age{gap:10px;padding-bottom:14px;margin-bottom:16px}
.age .n{font-size:44px;font-weight:600;letter-spacing:-.06em}
.age .sx{font-size:32px;color:#6c6c75}
dd{font-size:18px;font-weight:500;line-height:1.35;letter-spacing:-.025em}
dl{gap:16px}
.rx{border-left:3px solid #4256a5}
.rx h2{color:#4256a5}
.cond b{font-size:20px;font-weight:600;letter-spacing:-.035em}
.dose{border-radius:0 7px 7px 0;background:#f4f5f9;border-color:#4256a5;font-size:14px;font-weight:500;padding:11px 12px}
.dose small{font-family:var(--s);color:#4256a5}
.don2{background:#ecf7ef;border-left-color:#36744b;color:#21623c}
.don2 p{font-size:19px;font-weight:500;letter-spacing:-.025em}
.don2 .t{color:#36744b}
.reg{border-color:#21623c25}
.reg .m{font-size:28px;font-weight:600;letter-spacing:-.03em}
.will p{font-size:16px}
.will{border-bottom:0}
.id,.rx,.don2,.will{animation:arrive 240ms var(--ease-out) both}
.rx{animation-delay:40ms}.don2{animation-delay:80ms}.will{animation-delay:120ms}
@keyframes arrive{from{opacity:.65;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(hover:hover) and (pointer:fine){.ph img{transition:transform 240ms var(--ease-out)}.ph:hover img{transform:scale(1.025)}}
@media(prefers-reduced-motion:reduce){.id,.rx,.don2,.will{animation:soften 160ms ease both;animation-delay:0ms}@keyframes soften{from{opacity:.85}to{opacity:1}}.ph img{transition:none}.ph:hover img{transform:none}}
@media(max-width:540px){html{background:#fff}body{padding:0}main{border:0;border-radius:0;box-shadow:none}.top{padding:calc(18px + env(safe-area-inset-top)) 20px 18px}.top b{font-size:18px}section,.dnr{padding:20px}.crit{grid-template-columns:1fr 1fr}.crit>div{padding:16px 20px}.crit .don{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}.crit .don .k{margin-bottom:0}.crit .don .t{grid-column:1/-1}.crit .don .v{margin:0}.id{gap:16px;grid-template-columns:88px minmax(0,1fr)}.ph{width:88px}dd,dd.m{font-size:16px}.dose{font-size:13px}.age .n{font-size:40px}}
@media(max-width:360px){.id{grid-template-columns:72px minmax(0,1fr)}.ph{width:72px}.top svg{width:30px}.top .t{font-size:9px}}
@media print{html,body{background:white!important}body>*{display:none!important}body::before{content:'Impresión deshabilitada.';display:block;font:16px sans-serif}}
</style>
