<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Francisco Guadarrama</title>
</head>
<body>
<script>
(async () => {
  try {
    const response = await fetch('/redesign/index.html?redesign2-source=1', {cache:'no-store'});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    let html = await response.text();

    // Keep the proven /redesign CSS and JS byte-for-byte, then layer only
    // the deliberate root-site refinements on top.
    html = html.replace(
      '<link rel="stylesheet" href="assets/site.css">',
      '<link rel="stylesheet" href="/redesign/assets/site.css"><link rel="stylesheet" href="/redesign2/assets/enhancements.css?v=20260827-r2">'
    );

    html = html.replace(
      '  <aside class="debug-panel" id="debugPanel" hidden aria-label="Design debug panel">',
      '  <aside class="debug-panel" id="debugPanel" hidden aria-label="Design debug panel" style="display:none!important">'
    );

    html = html.replace(
      '<script src="assets/sounds.js" defer><\/script>',
      '<script src="/assets/sounds.js?v=20260827-r2" defer><\/script>'
    );
    html = html.replace(
      '<script src="assets/smoky-dissolve.js" defer><\/script>',
      '<script src="/assets/smoky-dissolve.js?v=20260827-r2" defer><\/script>'
    );
    html = html.replace(
      '<script src="assets/site.js" defer><\/script>',
      '<script type="module" src="/assets/haptics.js?v=20260827-r2"><\/script>' +
      '<script src="/redesign2/assets/enhancements-pre.js?v=20260827-r2" defer><\/script>' +
      '<script src="/redesign/assets/site.js" defer><\/script>' +
      '<script src="/redesign2/assets/enhancements.js?v=20260827-r2" defer><\/script>'
    );

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.textContent = 'Unable to load redesign2.';
    console.error(error);
  }
})();
</script>
</body>
</html>
