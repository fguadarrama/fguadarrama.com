<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Librero</title>
  <meta name="description" content="Mi librero virtual: lomos, portadas, sala de lectura y calificación celeste.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F7F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#303840" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="iconos/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300..900;1,400..900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Caveat:wght@500&family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Courier+Prime:wght@400;700&family=DM+Serif+Display&family=Fraunces:ital,wght@1,700&family=Josefin+Sans:wght@600&family=League+Gothic&family=Libre+Baskerville:ital@1&family=Oswald:wght@600&family=Playfair+Display:ital,wght@0,800;1,600&family=Space+Mono:wght@700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/librero.css">
</head>
<body data-vista="librero">
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="cabecera">
    <span class="cabecera-lado" aria-hidden="true"></span>
    <span class="cabecera-centro" aria-hidden="true"></span>

    <div class="cabecera-acciones">
    <div class="buscador" role="search" data-abierto="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
      <div class="t-clear">
        <input type="text" aria-label="Buscar en el librero" autocomplete="off" spellcheck="false" enterkeyhint="search" tabindex="-1">
        <div class="t-clear-mirror" aria-hidden="true"></div>
        <div class="t-clear-placeholder" aria-hidden="true">Buscar título, autor, serie…</div>
        <div class="t-clear-glow" aria-hidden="true"></div>
        <button type="button" class="t-clear-btn" aria-label="Borrar búsqueda" tabindex="-1"><svg viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8"/></svg></button>
      </div>
    </div>
    <div class="sugerencias" hidden></div>
    <button type="button" class="boton-icono gatos-boton" aria-pressed="true" aria-label="Ocultar a los gatos" title="Ocultar a los gatos">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <g class="cara-gato">
        <path d="M6.1 8.4 L6.2 4.9 L8.6 6.6 Q10 6.2 11.4 6.6 L13.8 4.9 L13.9 8.4 C14.7 9.6 14.6 12.9 12.8 14.1 C11.4 15.1 8.6 15.1 7.2 14.1 C5.4 12.9 5.3 9.6 6.1 8.4 Z"/>
        <circle cx="8.4" cy="10.3" r=".55" class="relleno"/><circle cx="11.6" cy="10.3" r=".55" class="relleno"/>
        <path d="M9.45 11.7 h1.1 L10 12.3 Z M10 12.3 q-.8 .9 -1.6 .3 M10 12.3 q.8 .9 1.6 .3"/>
        <path d="M5.7 11.4 L3.5 11 M5.7 12.7 L3.5 13.1 M14.3 11.4 L16.5 11 M14.3 12.7 L16.5 13.1"/>
        </g>
        <circle class="no-circulo" cx="10" cy="10" r="8.7" pathLength="1"/>
        <path class="no-tachado" d="M3.9 3.9 L16.1 16.1" pathLength="1"/>
      </svg>
    </button>
    <button type="button" class="boton-icono buscar-boton" aria-label="Buscar (tecla /)" aria-expanded="false" title="Buscar  /">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
    </button>

    <div class="menu-envoltura">
      <button type="button" class="boton-icono menu-boton" aria-label="Menú" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg>
        <b class="punto-cambios" hidden></b>
      </button>
      <div class="menu" id="menu" hidden>
        <p class="menu-titulo">Vistas</p>
        <nav class="menu-vistas" aria-label="Vistas">
          <a href="#/librero" data-pestana="librero"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3v14M7 5v12M11 3v14M14.5 6.5l2.5 10"/><path d="M1.5 17.5h17"/></svg><span>Librero</span></a>
          <a href="#/sala" data-pestana="sala"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l7.5 4.3v8.4L10 19.5l-7.5-4.3V6.8z"/><path d="M2.5 6.8L10 11l7.5-4.2M10 11v8.5"/></svg><span>Sala de lectura</span></a>
          <a href="#/portadas" data-pestana="portadas"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="6" height="8.5"/><rect x="11.5" y="3" width="6" height="8.5"/><path d="M2.5 15h6M11.5 15h6"/></svg><span>Portadas</span></a>
          <a href="#/arbol" data-pestana="arbol"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 18V9M10 12l-4-4M10 10l4-4M6 8l-2-3M6 8V4M14 6l3-2M14 6V2.5"/></svg><span>Árbol</span></a>
          <a href="#/tablero" data-pestana="tablero"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span>Tablero</span><b class="insignia-cambios" hidden>0</b></a>
        </nav>
        <p class="menu-titulo">Mostrar</p>
        <div class="filtros" role="toolbar" aria-label="Filtros">
          <div class="grupo-filtro" aria-label="Estado de lectura">
            <button type="button" data-filtro="estado:todos" aria-pressed="true">Todos</button>
            <button type="button" data-filtro="estado:sin" aria-pressed="false">Sin marcar</button>
            <button type="button" data-filtro="estado:por-leer" aria-pressed="false">Por leer</button>
            <button type="button" data-filtro="estado:leido" aria-pressed="false">Leídos</button>
            <button type="button" data-filtro="estado:descartado" aria-pressed="false">Descartados</button>
          </div>
          <div class="grupo-filtro" aria-label="Formato">
            <button type="button" data-filtro="formato:todos" aria-pressed="true">Todo formato</button>
            <button type="button" data-filtro="formato:fisico" aria-pressed="false">Físicos</button>
            <button type="button" data-filtro="formato:kindle" aria-pressed="false">Kindle</button>
          </div>
        </div>
        <p class="menu-titulo">Ordenar el librero</p>
        <div class="grupo-filtro" aria-label="Orden">
          <button type="button" data-filtro="orden:repisa" aria-pressed="true">Por repisa</button>
          <button type="button" data-filtro="orden:fecha" aria-pressed="false">Por fecha de adición</button>
        </div>
        <p class="menu-titulo">Exportar</p>
        <button type="button" class="boton chico exportar-boton" data-exportar>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h7l3.5 3.5v11.5H5z"/><path d="M12 2.5V6h3.5"/><path d="M10 9v5.5M7.6 12.2 10 14.6l2.4-2.4"/></svg>
          <span>Exportar PDF por repisa</span>
        </button>
        <div class="menu-pie">
          <span class="resultados" data-resultados aria-live="polite"></span>
          <span class="menu-marca">Librero</span>
          <button type="button" class="boton chico" data-tema>
            <svg class="sol" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7"/></svg>
            <svg class="luna" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.6A6.6 6.6 0 0 1 7.4 4.5a6.6 6.6 0 1 0 8.1 8.1z"/></svg>
            <span>Cambiar tema</span>
          </button>
          <button type="button" class="boton chico" data-sonido aria-pressed="true">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.5h3l4-3.5v12l-4-3.5h-3z"/><path class="ondas" d="M13.5 7a4 4 0 0 1 0 6M15.6 5a7 7 0 0 1 0 10"/></svg>
            <span>Sonido</span>
          </button>
        </div>
      </div>
    </div>
    </div>
  </header>

  <main id="contenido">
    <section class="vista" id="v-librero" aria-label="Librero"></section>
    <section class="vista" id="v-sala" aria-label="Sala de lectura" hidden></section>
    <section class="vista" id="v-portadas" aria-label="Portadas" hidden></section>
    <section class="vista" id="v-arbol" aria-label="Árbol de lectura" hidden></section>
    <section class="vista" id="v-tablero" aria-label="Tablero" hidden></section>
  </main>

  <div class="avisos" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
